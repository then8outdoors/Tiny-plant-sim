<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tiny Plant Sim 1.1</title>
  
  <!-- 90s Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Press Start 2P"', 'monospace']
          },
          colors: {
            retro: {
              bg: '#111827', // Dark screen
              panel: '#1f2937',
              green: '#39ff14', // Neon arcade green
              red: '#ff003c',   // Neon red
              yellow: '#ffea00', // Arcade yellow
              blue: '#00f0ff',   // Cyan/Blue
              border: '#94a3b8'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      background-color: #000;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    /* CRT Scanline Filter */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 3px 100%;
      z-index: 100;
      pointer-events: none;
    }
    
    /* Reusable Retro UI Classes */
    .retro-panel {
      background-color: #1f2937;
      border: 3px solid #94a3b8;
      box-shadow: 4px 4px 0px 0px #000;
    }
    .retro-btn {
      border: 2px solid #fff;
      box-shadow: 3px 3px 0px 0px #000;
      transition: all 0.05s ease;
    }
    .retro-btn:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px 0px #000;
    }
    .retro-btn:disabled {
      opacity: 0.5;
      box-shadow: 1px 1px 0px 0px #000;
      transform: translate(2px, 2px);
    }
    
    /* Jagged SVG Rendering for 8-bit feel */
    svg.pixelated {
      shape-rendering: crispEdges;
    }
  </style>
</head>
<body class="text-white">
  <div class="crt-overlay"></div>
  <div id="root" class="h-full relative z-10 bg-retro-bg"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PLANT_ARCHETYPES = {
      cactus: {
        name: 'DESERT CACTUS',
        tagline: 'LOVES INTENSE SUN & LITTLE WATER.',
        moisture: [10, 35], sunlight: [65, 95], temp: [72, 95], soil: [25, 65],
        color: '#22c55e', leafColor: '#16a34a'
      },
      succulent: {
        name: 'FLESHY SUCCULENT',
        tagline: 'THRIVES IN WARMTH & DRY SOIL.',
        moisture: [20, 45], sunlight: [55, 85], temp: [65, 88], soil: [40, 75],
        color: '#14b8a6', leafColor: '#0d9488'
      },
      fern: {
        name: 'CANOPY FERN',
        tagline: 'CRAVES MOISTURE & GENTLE SHADE.',
        moisture: [60, 90], sunlight: [25, 55], temp: [60, 76], soil: [60, 95],
        color: '#4ade80', leafColor: '#22c55e'
      },
      leafy: {
        name: 'BROAD AROID',
        tagline: 'BALANCED LIGHT & STEADY WARMTH.',
        moisture: [45, 75], sunlight: [40, 75], temp: [65, 82], soil: [50, 90],
        color: '#86efac', leafColor: '#4ade80'
      }
    };

    function generateNewPlant(slotNum, customName) {
      const types = Object.keys(PLANT_ARCHETYPES);
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const archetype = PLANT_ARCHETYPES[chosenType];
      const randomReveal = Math.floor(Math.random() * (12 - 6 + 1)) + 6;

      return {
        id: Date.now(),
        slotName: customName || `SLOT ${slotNum + 1}`,
        type: chosenType,
        revealed: false,
        revealAge: randomReveal,
        age: 1.0,
        health: 100,
        isDead: false,
        potColor: ['#ea580c', '#d97706', '#059669', '#475569'][slotNum % 4],
        conditions: { moisture: 50, sunlight: 50, temperature: 72, soilHealth: 85, infestation: 0 },
        ideals: {
          moisture: [...archetype.moisture], sunlight: [...archetype.sunlight],
          temp: [...archetype.temp], soil: [...archetype.soil]
        }
      };
    }

    // Simplified Blocky Icons for Retro feel
    const DropletIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L12 2 L16 10 L18 14 L18 18 L16 22 L8 22 L6 18 L6 14 L8 10 Z"/></svg>
    );
    const SunIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8"/><rect x="11" y="2" width="2" height="4"/><rect x="11" y="18" width="2" height="4"/><rect x="2" y="11" width="4" height="2"/><rect x="18" y="11" width="4" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="18" y="18" width="2" height="2"/><rect x="4" y="18" width="2" height="2"/><rect x="18" y="4" width="2" height="2"/></svg>
    );
    const ThermometerIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="2" width="4" height="14"/><rect x="8" y="14" width="8" height="8"/></svg>
    );
    const BugIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="6" width="8" height="12"/><rect x="4" y="8" width="4" height="2"/><rect x="16" y="8" width="4" height="2"/><rect x="4" y="14" width="4" height="2"/><rect x="16" y="14" width="4" height="2"/><rect x="10" y="2" width="1" height="4"/><rect x="13" y="2" width="1" height="4"/></svg>
    );
    const ShovelIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="14,2 22,2 22,10 12,20 4,20 4,12"/><rect x="4" y="14" width="6" height="6" fill="#111827"/></svg>
    );
    const SprayIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="14"/><rect x="10" y="4" width="4" height="4"/><rect x="4" y="4" width="6" height="2"/><rect x="2" y="4" width="2" height="6"/></svg>
    );
    const ScissorsIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><polygon points="10,10 20,2 20,6 12,12"/><polygon points="10,14 20,22 20,18 12,12"/><rect x="6" y="6" width="2" height="2" fill="#111827"/><rect x="6" y="16" width="2" height="2" fill="#111827"/></svg>
    );
    const PencilIcon = () => (
      <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="16,2 22,8 8,22 2,22 2,16"/></svg>
    );
    const ArrowLeftIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="10,4 2,12 10,20 10,14 22,14 22,10 10,10"/></svg>
    );
    const TrashIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="16"/><rect x="4" y="4" width="16" height="2"/><rect x="10" y="2" width="4" height="2"/></svg>
    );

    function App() {
      const [screen, setScreen] = useState('home');
      const [activeSlot, setActiveSlot] = useState(0);
      const [slotsData, setSlotsData] = useState(() => {
        return [0, 1, 2].map(idx => {
          const raw = localStorage.getItem(`plant_slot_${idx}`);
          return raw ? JSON.parse(raw) : null;
        });
      });
      const [plant, setPlant] = useState(null);
      const [toast, setToast] = useState('');
      const [nameModal, setNameModal] = useState({ open: false, slotIndex: 0, currentName: '', isNew: false });
      const [revealModal, setRevealModal] = useState({ open: false, plantType: null });

      useEffect(() => {
        if (!plant) return;
        localStorage.setItem(`plant_slot_${activeSlot}`, JSON.stringify(plant));
        setSlotsData(prev => {
          const next = [...prev];
          next[activeSlot] = plant;
          return next;
        });
      }, [plant, activeSlot]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2000);
      };

      useEffect(() => {
        if (screen !== 'game' || !plant || plant.isDead || revealModal.open) return;

        const interval = setInterval(() => {
          setPlant(prev => {
            if (!prev || prev.isDead) return prev;

            let { moisture, sunlight, temperature, soilHealth, infestation } = prev.conditions;
            let healthDelta = 0;

            const moistureDrain = 1.0 + (temperature > 80 ? 0.8 : 0) + (sunlight > 75 ? 0.6 : 0);
            moisture = Math.max(0, Math.min(100, moisture - moistureDrain));
            soilHealth = Math.max(0, Math.min(100, soilHealth - 0.25));

            if (soilHealth < 40 || moisture > 85) {
              if (Math.random() < 0.35) infestation = Math.min(100, infestation + 4);
            }

            const [mMin, mMax] = prev.ideals.moisture;
            const [sMin, sMax] = prev.ideals.sunlight;
            const [tMin, tMax] = prev.ideals.temp;
            const [soilMin] = prev.ideals.soil;

            if (moisture < mMin) healthDelta -= (mMin - moisture) * 0.15;
            else if (moisture > mMax) healthDelta -= (moisture - mMax) * 0.15;
            else healthDelta += 0.5;

            if (sunlight < sMin) healthDelta -= (sMin - sunlight) * 0.12;
            else if (sunlight > sMax) healthDelta -= (sunlight - sMax) * 0.12;
            else healthDelta += 0.4;

            if (temperature < tMin) healthDelta -= (tMin - temperature) * 0.18;
            else if (temperature > tMax) healthDelta -= (temperature - tMax) * 0.18;

            if (soilHealth < soilMin) healthDelta -= 1.2;
            if (infestation > 15) healthDelta -= (infestation - 15) * 0.22;

            const newHealth = Math.max(0, Math.min(100, prev.health + healthDelta));
            const isDead = newHealth <= 0;

            let newAge = prev.age;
            let newlyRevealed = false;
            let newRevealedState = prev.revealed;

            if (!isDead && newHealth > 40) {
              newAge = +(prev.age + 0.15).toFixed(2);
              if (!prev.revealed && newAge >= prev.revealAge) {
                newRevealedState = true;
                newlyRevealed = true;
              }
            }

            if (newlyRevealed) {
              setRevealModal({ open: true, plantType: prev.type });
            }

            return {
              ...prev,
              age: newAge,
              health: Math.round(newHealth),
              revealed: newRevealedState,
              isDead,
              conditions: {
                moisture: Math.round(moisture),
                sunlight,
                temperature,
                soilHealth: Math.round(soilHealth),
                infestation: Math.round(infestation)
              }
            };
          });
        }, 3000);

        return () => clearInterval(interval);
      }, [screen, plant?.isDead, revealModal.open]);

      const applyCare = (action) => {
        if (!plant || plant.isDead) return;

        setPlant(prev => {
          let c = { ...prev.conditions };
          let h = prev.health;

          switch (action) {
            case 'water':
              c.moisture = Math.min(100, c.moisture + 22);
              if (c.infestation > 0) c.infestation = Math.max(0, c.infestation - 4);
              showToast('+H2O');
              break;
            case 'fertilize':
              c.soilHealth = Math.min(100, c.soilHealth + 26);
              showToast('+SOIL');
              break;
            case 'sun_up':
              c.sunlight = Math.min(100, c.sunlight + 15);
              showToast('+SUN');
              break;
            case 'sun_down':
              c.sunlight = Math.max(0, c.sunlight - 15);
              showToast('-SUN');
              break;
            case 'temp_up':
              c.temperature = Math.min(105, c.temperature + 4);
              showToast('+HEAT');
              break;
            case 'temp_down':
              c.temperature = Math.max(40, c.temperature - 4);
              showToast('-HEAT');
              break;
            case 'spray':
              c.infestation = Math.max(0, c.infestation - 45);
              c.soilHealth = Math.max(0, c.soilHealth - 6);
              showToast('PESTS CLR');
              break;
            case 'prune':
              h = Math.min(100, h + 8);
              showToast('+HP');
              break;
          }

          return { ...prev, health: h, conditions: c };
        });
      };

      const startNewGamePrompt = (slotIdx) => {
        setNameModal({ open: true, slotIndex: slotIdx, currentName: `SLOT ${slotIdx + 1}`, isNew: true });
      };

      const editSlotNamePrompt = (slotIdx) => {
        const current = slotsData[slotIdx]?.slotName || (plant && activeSlot === slotIdx ? plant.slotName : `SLOT ${slotIdx + 1}`);
        setNameModal({ open: true, slotIndex: slotIdx, currentName: current, isNew: false });
      };

      const handleSaveName = (enteredName) => {
        const finalName = enteredName.trim().toUpperCase() || `SLOT ${nameModal.slotIndex + 1}`;
        if (nameModal.isNew) {
          const fresh = generateNewPlant(nameModal.slotIndex, finalName);
          setPlant(fresh);
          setActiveSlot(nameModal.slotIndex);
          localStorage.setItem(`plant_slot_${nameModal.slotIndex}`, JSON.stringify(fresh));
          setSlotsData(prev => { const next = [...prev]; next[nameModal.slotIndex] = fresh; return next; });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false });
          setScreen('game');
        } else {
          if (plant && activeSlot === nameModal.slotIndex) setPlant(prev => ({ ...prev, slotName: finalName }));
          setSlotsData(prev => {
            const next = [...prev];
            if (next[nameModal.slotIndex]) {
              next[nameModal.slotIndex] = { ...next[nameModal.slotIndex], slotName: finalName };
              localStorage.setItem(`plant_slot_${nameModal.slotIndex}`, JSON.stringify(next[nameModal.slotIndex]));
            }
            return next;
          });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false });
        }
      };

      const deleteSlot = (slotIdx, e) => {
        e.stopPropagation();
        if (confirm(`ERASE SLOT ${slotIdx + 1}?`)) {
          localStorage.removeItem(`plant_slot_${slotIdx}`);
          setSlotsData(prev => { const next = [...prev]; next[slotIdx] = null; return next; });
          if (activeSlot === slotIdx) setPlant(null);
        }
      };

      const selectSlotToPlay = (slotIdx) => {
        setActiveSlot(slotIdx);
        setPlant(slotsData[slotIdx]);
        setScreen('game');
      };

      // Arcade pure colors for status bars
      const getBarColor = (val, [min, max], isPest = false) => {
        if (isPest) {
          if (val <= 15) return 'bg-retro-green';
          if (val <= 40) return 'bg-retro-yellow';
          return 'bg-retro-red';
        }
        if (val >= min && val <= max) return 'bg-retro-green';
        const dist = Math.min(Math.abs(val - min), Math.abs(val - max));
        if (dist <= 12) return 'bg-retro-yellow';
        return 'bg-retro-red';
      };

      const getVisualPlantColors = () => {
        if (!plant) return { body: '#39ff14', leaf: '#39ff14', stroke: '#000' };
        if (plant.isDead) return { body: '#555', leaf: '#444', stroke: '#000' };
        if (plant.health < 35 && plant.conditions.moisture < plant.ideals.moisture[0]) {
          return { body: '#d97706', leaf: '#f59e0b', stroke: '#000' };
        }
        if (plant.health < 35 && plant.conditions.moisture > plant.ideals.moisture[1]) {
          return { body: '#064e3b', leaf: '#047857', stroke: '#000' };
        }
        const arch = PLANT_ARCHETYPES[plant.type];
        return { body: arch.color, leaf: arch.leafColor, stroke: '#000' };
      };

      const colors = getVisualPlantColors();
      const growthProgress = plant ? Math.min(plant.age / 18, 1) : 0.5;
      const plantHeight = 24 + growthProgress * 70;
      const soilBaseY = 168;
      const stemTopY = soilBaseY - plantHeight;
      const isBlooming = plant && !plant.isDead && plant.age >= 6 && plant.health >= 55;

      return (
        <div className="h-full w-full max-w-md mx-auto flex flex-col justify-between overflow-hidden p-3 box-border">
          
          {/* ======================= SCREEN 1: TITLE / HOME ======================= */}
          {screen === 'home' && (
            <div className="h-full flex flex-col justify-between py-2">
              <div className="flex justify-center items-center px-1 py-4">
                <span className="text-[10px] text-retro-border">INSERT COIN TO PLAY</span>
              </div>

              <div className="flex flex-col items-center my-auto text-center px-4">
                <div className="w-16 h-16 mb-4 bg-black flex items-center justify-center border-4 border-retro-green shadow-[4px_4px_0px_0px_#39ff14]">
                  <DropletIcon />
                </div>
                <h1 className="text-xl leading-relaxed text-retro-green shadow-black drop-shadow-md">
                  TINY PLANT<br/>SIM v1.0
                </h1>
                <p className="text-[8px] text-retro-border mt-4 max-w-[240px] leading-loose">
                  PROCEDURAL FLORA.<br/>SELECT A SAVE FILE.
                </p>
              </div>

              <div className="space-y-3 mb-6">
                {[0, 1, 2].map((idx) => {
                  const data = slotsData[idx];
                  return (
                    <div key={idx} className="retro-panel flex items-center justify-between p-3">
                      {data ? (
                        <div className="flex-1 min-w-0 pr-2">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] text-retro-blue truncate">
                              {data.slotName || `SLOT ${idx + 1}`}
                            </span>
                            <button onClick={() => editSlotNamePrompt(idx)} className="text-retro-border hover:text-white"><PencilIcon /></button>
                          </div>
                          <div className="flex flex-col gap-1 mt-2 text-[8px] text-retro-border">
                            <span>{data.isDead ? 'WITHERED' : data.revealed ? PLANT_ARCHETYPES[data.type].name : 'MYSTERY SEED'}</span>
                            <span>DAY {Math.floor(data.age)} • <span className={data.isDead ? 'text-retro-red' : 'text-retro-green'}>{data.isDead ? 'DEAD' : `${data.health}% HP`}</span></span>
                          </div>
                        </div>
                      ) : (
                        <div className="flex-1 min-w-0">
                          <span className="text-[10px] text-retro-border">FILE {idx + 1} : EMPTY</span>
                        </div>
                      )}

                      <div className="flex items-center gap-2 shrink-0">
                        {data ? (
                          <>
                            <button onClick={() => selectSlotToPlay(idx)} className="retro-btn bg-retro-green text-black px-2 py-2 text-[8px]">
                              PLAY
                            </button>
                            <button onClick={(e) => deleteSlot(idx, e)} className="retro-btn bg-retro-red text-white p-2">
                              <TrashIcon />
                            </button>
                          </>
                        ) : (
                          <button onClick={() => startNewGamePrompt(idx)} className="retro-btn bg-retro-panel border-retro-border text-white px-2 py-2 text-[8px]">
                            NEW GAME
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <footer className="text-center text-[8px] text-retro-border">
                © 2026 RETRO STUDIOS
              </footer>
            </div>
          )}

          {/* ======================= SCREEN 2: GAMEPLAY (TIGHT LAYOUT) ======================= */}
          {screen === 'game' && plant && (
            <div className="h-full flex flex-col justify-between overflow-hidden">
              
              {/* TOP SECTION */}
              <div className="shrink-0 space-y-2 pb-1">
                <div className="flex items-center justify-between py-1 border-b-4 border-retro-panel">
                  <button onClick={() => setScreen('home')} className="retro-btn bg-retro-panel text-white px-2 py-1.5 text-[8px] flex items-center gap-1">
                    <ArrowLeftIcon /> BACK
                  </button>

                  <div className="flex items-center gap-2 max-w-[140px] truncate">
                    <span className="text-[10px] text-retro-blue truncate">{plant.slotName}</span>
                    <button onClick={() => editSlotNamePrompt(activeSlot)} className="text-retro-border hover:text-white"><PencilIcon /></button>
                  </div>

                  <span className={`text-[10px] px-2 py-1 border-2 border-current bg-black ${plant.isDead ? 'text-retro-red' : plant.health > 70 ? 'text-retro-green' : plant.health > 35 ? 'text-retro-yellow' : 'text-retro-red'}`}>
                    {plant.isDead ? 'DEAD' : `HP:${plant.health}`}
                  </span>
                </div>

                <div className="flex justify-between items-center px-1 pt-1">
                  <span className="text-[10px] text-white">
                    {plant.isDead ? 'WITHERED' : plant.revealed ? PLANT_ARCHETYPES[plant.type].name : 'MYSTERY SEED'}
                  </span>
                  <span className="text-[10px] text-retro-border">
                    DAY {Math.floor(plant.age)}
                  </span>
                </div>
              </div>

              {/* MIDDLE SECTION: Expanded Visuals */}
              <div className="flex-1 min-h-0 grid grid-cols-12 gap-3 my-2 items-stretch retro-panel p-2">
                
                {/* SVG Visual Window (Blocky, Crisp Edges) */}
                <div className="col-span-7 h-full flex flex-col items-center justify-center relative bg-black border-4 border-retro-border overflow-hidden">
                  <svg viewBox="0 0 200 215" className="w-full h-full max-h-full overflow-visible pixelated" preserveAspectRatio="xMidYMid meet">
                    
                    {plant.conditions.infestation > 10 && (
                      <g fill="#ff003c">
                        <rect x="85" y={soilBaseY - 30} width="4" height="4" />
                        <rect x="115" y={soilBaseY - 45} width="4" height="4" />
                        <rect x="102" y={soilBaseY - 60} width="4" height="4" />
                        <rect x="75" y={soilBaseY - 15} width="4" height="4" />
                      </g>
                    )}

                    {plant.isDead ? (
                      <g stroke="#555" strokeWidth="6" fill="none">
                        <polyline points="100,170 102,140 120,135 135,132 135,155" />
                        <polyline points="112,140 125,150 120,162" />
                      </g>
                    ) : !plant.revealed ? (
                      <g strokeWidth="4">
                        <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={colors.body} />
                        <polyline points={`100,${stemTopY} 85,${stemTopY-5} 78,${stemTopY}`} stroke={colors.leaf} fill="none"/>
                        <polyline points={`100,${stemTopY} 115,${stemTopY-5} 122,${stemTopY}`} stroke={colors.leaf} fill="none"/>
                      </g>
                    ) : plant.type === 'cactus' ? (
                      <g>
                        <rect x="88" y={stemTopY} width="24" height={plantHeight} fill={colors.body} stroke={colors.stroke} strokeWidth="4" />
                        <line x1="84" y1={stemTopY + 20} x2="116" y2={stemTopY + 20} stroke="#ffea00" strokeWidth="2" />
                        <line x1="84" y1={stemTopY + 45} x2="116" y2={stemTopY + 45} stroke="#ffea00" strokeWidth="2" />
                        {plant.age >= 10 && (
                          <polyline points={`88,${stemTopY+35} 75,${stemTopY+35} 75,${stemTopY+15} 82,${stemTopY+15}`} stroke={colors.body} strokeWidth="8" fill="none" />
                        )}
                        {plant.age >= 13 && (
                          <polyline points={`112,${stemTopY+48} 125,${stemTopY+48} 125,${stemTopY+28} 118,${stemTopY+28}`} stroke={colors.body} strokeWidth="8" fill="none" />
                        )}
                        {isBlooming && (
                          <rect x="94" y={stemTopY - 12} width="12" height="12" fill="#ff003c" />
                        )}
                      </g>
                    ) : plant.type === 'fern' ? (
                      <g stroke={colors.body} fill="none" strokeWidth="4">
                        <line x1="100" y1={soilBaseY} x2="98" y2={stemTopY} />
                        {[0.25, 0.5, 0.75, 1.0].map((frac, idx) => {
                          const yPos = soilBaseY - plantHeight * frac;
                          const spread = 20 + frac * 16;
                          return (
                            <g key={idx}>
                              <polyline points={`100,${yPos} ${100-spread},${yPos-10} ${100-spread-4},${yPos+4}`} stroke={colors.leaf} />
                              <polyline points={`100,${yPos} ${100+spread},${yPos-10} ${100+spread+4},${yPos+4}`} stroke={colors.leaf} />
                            </g>
                          );
                        })}
                        {isBlooming && (
                          <g fill="#00f0ff" stroke="none">
                            <rect x="68" y={stemTopY + 16} width="6" height="6" />
                            <rect x="126" y={stemTopY + 20} width="6" height="6" />
                            <rect x="96" y={stemTopY - 4} width="8" height="8" fill="#fff" />
                          </g>
                        )}
                      </g>
                    ) : plant.type === 'succulent' ? (
                      <g fill={colors.leaf} stroke={colors.stroke} strokeWidth="2">
                        <rect x="66" y={soilBaseY - 20} width="68" height="20" />
                        <rect x="76" y={soilBaseY - 30} width="48" height="18" />
                        <rect x="86" y={soilBaseY - 40} width="28" height="16" fill={colors.body} />
                        {isBlooming && (
                          <g>
                            <polyline points={`100,${soilBaseY-30} 118,${soilBaseY-60} 122,${soilBaseY-80}`} stroke="#39ff14" strokeWidth="4" fill="none" />
                            <rect x="118" y={soilBaseY - 84} width="8" height="8" fill="#ffea00" />
                          </g>
                        )}
                      </g>
                    ) : (
                      <g>
                        <g fill={colors.leaf} stroke={colors.stroke} strokeWidth="2">
                          <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={colors.body} strokeWidth="4" />
                          <polygon points={`100,${soilBaseY - plantHeight*0.4} 70,${soilBaseY - plantHeight*0.5} 62,${soilBaseY - plantHeight*0.35} 80,${soilBaseY - plantHeight*0.28}`} />
                          <polygon points={`100,${soilBaseY - plantHeight*0.65} 130,${soilBaseY - plantHeight*0.75} 138,${soilBaseY - plantHeight*0.6} 120,${soilBaseY - plantHeight*0.52}`} />
                          <polygon points={`100,${stemTopY} 85,${stemTopY-20} 100,${stemTopY-25} 115,${stemTopY-20}`} />
                        </g>
                        {isBlooming && (
                          <g>
                            <polyline points={`98,${soilBaseY-15} 84,${soilBaseY-50} 80,${soilBaseY-75}`} stroke="#39ff14" strokeWidth="4" fill="none" />
                            <rect x="72" y={soilBaseY - 86} width="16" height="20" fill="#fff" stroke="#000" strokeWidth="2" />
                            <rect x="78" y={soilBaseY - 82} width="4" height="12" fill="#ffea00" />
                          </g>
                        )}
                      </g>
                    )}

                    {/* Blocky Pot */}
                    <rect x="58" y="163" width="84" height="14" fill="#3e2723" stroke="#000" strokeWidth="2" />
                    <polygon points="60,170 70,214 130,214 140,170" fill={plant.potColor} stroke="#000" strokeWidth="2" />
                  </svg>
                </div>

                {/* Status Condition Bars (Blocky, No curves) */}
                <div className="col-span-5 flex flex-col justify-between py-1 px-1">
                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><DropletIcon /> H2O</span>
                      <span>{plant.conditions.moisture}%</span>
                    </div>
                    <div className="w-full bg-black border-2 border-retro-border h-3">
                      <div className={`h-full ${getBarColor(plant.conditions.moisture, plant.ideals.moisture)}`} style={{ width: `${plant.conditions.moisture}%` }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><SunIcon /> SUN</span>
                      <span>{plant.conditions.sunlight}%</span>
                    </div>
                    <div className="w-full bg-black border-2 border-retro-border h-3">
                      <div className={`h-full ${getBarColor(plant.conditions.sunlight, plant.ideals.sunlight)}`} style={{ width: `${plant.conditions.sunlight}%` }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><ThermometerIcon /> TMP</span>
                      <span>{plant.conditions.temperature}°</span>
                    </div>
                    <div className="w-full bg-black border-2 border-retro-border h-3">
                      <div className={`h-full ${getBarColor(plant.conditions.temperature, plant.ideals.temp)}`} style={{ width: `${Math.min(100, Math.max(0, (plant.conditions.temperature - 40) * 1.5))}%` }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><ShovelIcon /> DIRT</span>
                      <span>{plant.conditions.soilHealth}%</span>
                    </div>
                    <div className="w-full bg-black border-2 border-retro-border h-3">
                      <div className={`h-full ${getBarColor(plant.conditions.soilHealth, plant.ideals.soil)}`} style={{ width: `${plant.conditions.soilHealth}%` }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><BugIcon /> BUG</span>
                      <span>{plant.conditions.infestation}%</span>
                    </div>
                    <div className="w-full bg-black border-2 border-retro-border h-3">
                      <div className={`h-full ${getBarColor(plant.conditions.infestation, [0, 15], true)}`} style={{ width: `${plant.conditions.infestation}%` }} />
                    </div>
                  </div>
                </div>
              </div>

              {/* BOTTOM SECTION: Snapped Action Controls */}
              <div className="shrink-0 space-y-2 pb-1">
                
                {/* 8-bit Toast Notification */}
                <div className="h-6 flex items-center justify-center">
                  {toast && (
                    <span className="text-[8px] text-black bg-retro-green px-2 py-1 border-2 border-white shadow-[2px_2px_0_0_#000]">
                      {toast}
                    </span>
                  )}
                </div>

                {/* Main Actions */}
                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => applyCare('water')} disabled={plant.isDead} className="retro-btn bg-[#1d4ed8] text-white py-2 flex flex-col items-center">
                    <DropletIcon />
                    <span className="text-[7px] mt-2">WATER</span>
                  </button>
                  <button onClick={() => applyCare('fertilize')} disabled={plant.isDead} className="retro-btn bg-[#b45309] text-white py-2 flex flex-col items-center">
                    <ShovelIcon />
                    <span className="text-[7px] mt-2">FEED</span>
                  </button>
                  <button onClick={() => applyCare('spray')} disabled={plant.isDead} className="retro-btn bg-[#be123c] text-white py-2 flex flex-col items-center">
                    <SprayIcon />
                    <span className="text-[7px] mt-2">SPRAY</span>
                  </button>
                  <button onClick={() => applyCare('prune')} disabled={plant.isDead} className="retro-btn bg-[#047857] text-white py-2 flex flex-col items-center">
                    <ScissorsIcon />
                    <span className="text-[7px] mt-2">PRUNE</span>
                  </button>
                </div>

                {/* Env Controls */}
                <div className="grid grid-cols-2 gap-2">
                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1"><SunIcon /> SUN</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('sun_down')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">-</button>
                      <button onClick={() => applyCare('sun_up')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">+</button>
                    </div>
                  </div>

                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1"><ThermometerIcon /> TMP</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('temp_down')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">-</button>
                      <button onClick={() => applyCare('temp_up')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">+</button>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          )}

          {/* ======================= MODAL: RENAME / NEW SLOT ======================= */}
          {nameModal.open && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel p-4">
                <h3 className="text-[10px] text-white mb-2">
                  {nameModal.isNew ? `NEW FILE (SLOT ${nameModal.slotIndex + 1})` : 'RENAME FILE'}
                </h3>
                <p className="text-[8px] text-retro-border mb-4 leading-relaxed">
                  ENTER DESIGNATION CODE:
                </p>
                <form onSubmit={(e) => { e.preventDefault(); handleSaveName(e.target.elements.slotInput.value); }}>
                  <input
                    name="slotInput"
                    defaultValue={nameModal.currentName}
                    autoFocus
                    maxLength={12}
                    className="w-full px-2 py-2 text-[10px] bg-black border-2 border-retro-border text-retro-green focus:outline-none focus:border-white mb-4 uppercase"
                  />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false })} className="retro-btn flex-1 py-2 text-[8px] bg-black text-white">
                      CANCEL
                    </button>
                    <button type="submit" className="retro-btn flex-1 py-2 text-[8px] bg-retro-green text-black">
                      ACCEPT
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================= MODAL: SPECIES UNLOCKED ANNOUNCEMENT ======================= */}
          {revealModal.open && revealModal.plantType && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel border-retro-green p-5 text-center">
                
                <div className="mb-4 animate-pulse">
                  <span className="text-[10px] text-black bg-retro-green px-2 py-1">SPECIES IDENTIFIED!</span>
                </div>

                <h2 className="text-sm text-white mb-2">
                  {PLANT_ARCHETYPES[revealModal.plantType].name}
                </h2>

                <p className="text-[8px] text-retro-border mb-4 leading-loose">
                  {PLANT_ARCHETYPES[revealModal.plantType].tagline}
                </p>

                <div className="bg-black border-2 border-retro-border p-3 text-left text-[8px] space-y-2 mb-6">
                  <div className="flex justify-between">
                    <span className="text-retro-border">IDEAL H2O:</span>
                    <span className="text-retro-blue">{PLANT_ARCHETYPES[revealModal.plantType].moisture[0]}-{PLANT_ARCHETYPES[revealModal.plantType].moisture[1]}%</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-retro-border">IDEAL SUN:</span>
                    <span className="text-retro-yellow">{PLANT_ARCHETYPES[revealModal.plantType].sunlight[0]}-{PLANT_ARCHETYPES[revealModal.plantType].sunlight[1]}%</span>
                  </div>
                </div>

                <button onClick={() => setRevealModal({ open: false, plantType: null })} className="retro-btn w-full py-3 bg-retro-green text-black text-[8px]">
                  CONTINUE
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
