<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tiny Plant Sim 1.2</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Press Start 2P"', 'monospace'] },
          colors: {
            retro: {
              bg: '#111827', panel: '#1f2937', green: '#16a34a', neonGreen: '#39ff14', red: '#ff003c', yellow: '#ffea00', blue: '#00f0ff', border: '#94a3b8'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { height: 100%; height: 100dvh; overflow: hidden; touch-action: manipulation; }
    body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    
    .crt-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 3px 100%; z-index: 100; pointer-events: none;
    }
    
    .retro-panel { background-color: #ffffff; border: 3px solid #334155; box-shadow: 4px 4px 0px 0px #000; }
    .dark .retro-panel { background-color: #1f2937; border-color: #94a3b8; }

    .retro-btn { border: 2px solid #000; box-shadow: 3px 3px 0px 0px #000; transition: all 0.05s ease; }
    .dark .retro-btn { border-color: #fff; }
    .retro-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0px 0px 0px 0px #000; }
    .retro-btn:disabled { opacity: 0.5; box-shadow: 1px 1px 0px 0px #000; transform: translate(2px, 2px); }
    
    svg.pixelated { shape-rendering: crispEdges; }

    @keyframes retroBop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .plant-idle-anim { animation: retroBop 1.2s steps(2, start) infinite; transform-origin: bottom center; }

    @keyframes bugTwitch { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(1px, -1px); } }
    .bug-idle-anim { animation: bugTwitch 0.4s steps(2, start) infinite; }

    @keyframes flowerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .flower-anim { animation: flowerPulse 0.8s steps(2, start) infinite; transform-origin: center; }
  </style>
</head>
<body class="bg-slate-200 dark:bg-black text-slate-900 dark:text-white transition-colors duration-150">
  <div class="crt-overlay"></div>
  <div id="root" class="h-full relative z-10 bg-slate-200 dark:bg-retro-bg transition-colors duration-150"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PLANT_ARCHETYPES = {
      cactus: { name: 'DESERT CACTUS', tagline: 'LOVES INTENSE SUN & LITTLE WATER.', moisture: [10, 35], sunlight: [65, 95], temp: [72, 95], soil: [25, 65], color: '#16a34a', leafColor: '#15803d' },
      succulent: { name: 'FLESHY SUCC', tagline: 'THRIVES IN WARMTH & DRY SOIL.', moisture: [20, 45], sunlight: [55, 85], temp: [65, 88], soil: [40, 75], color: '#0d9488', leafColor: '#0f766e' },
      fern: { name: 'CANOPY FERN', tagline: 'CRAVES MOISTURE & GENTLE SHADE.', moisture: [60, 90], sunlight: [25, 55], temp: [60, 76], soil: [60, 95], color: '#22c55e', leafColor: '#16a34a' },
      leafy: { name: 'BROAD AROID', tagline: 'BALANCED LIGHT & STEADY WARMTH.', moisture: [45, 75], sunlight: [40, 75], temp: [65, 82], soil: [50, 90], color: '#4ade80', leafColor: '#22c55e' },
      bonsai: { name: 'PINE BONSAI', tagline: 'ANCIENT TREE CRAVING STRICT CARE.', moisture: [35, 60], sunlight: [45, 75], temp: [60, 80], soil: [60, 95], color: '#78350f', leafColor: '#065f46' },
      flytrap: { name: 'SNAP TRAP', tagline: 'CARNIVOROUS SPROUT. WARM & DAMP.', moisture: [65, 95], sunlight: [50, 80], temp: [70, 90], soil: [20, 55], color: '#dc2626', leafColor: '#16a34a' },
      orchid: { name: 'MOTH ORCHID', tagline: 'TROPICAL BEAUTY. HUMID AIR.', moisture: [50, 80], sunlight: [30, 60], temp: [68, 84], soil: [40, 75], color: '#d946ef', leafColor: '#84cc16' },
      snake: { name: 'VIPER BLADE', tagline: 'TOUGH AS NAILS. HARD TO KILL.', moisture: [10, 40], sunlight: [20, 85], temp: [55, 90], soil: [20, 80], color: '#eab308', leafColor: '#15803d' },
      bamboo: { name: 'LUCKY BAMBOO', tagline: 'HAPPY IN PURE WATER & SHADE.', moisture: [60, 95], sunlight: [25, 60], temp: [65, 85], soil: [35, 80], color: '#84cc16', leafColor: '#4d7c0f' },
      sunflower: { name: 'SUN CHASER', tagline: 'WORSHIPS THE BLAZING SUN.', moisture: [40, 70], sunlight: [75, 100], temp: [70, 92], soil: [50, 90], color: '#ca8a04', leafColor: '#22c55e' }
    };

    function getArch(type) { return PLANT_ARCHETYPES[type] || PLANT_ARCHETYPES['leafy']; }
    
    function safeLoadSlot(slotIdx) {
      try {
        const raw = localStorage.getItem('plant_slot_' + slotIdx);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.conditions && parsed.ideals) {
          if (!PLANT_ARCHETYPES[parsed.type]) parsed.type = 'leafy';
          return parsed;
        }
        return null;
      } catch (err) { return null; }
    }

    function generateNewPlant(slotNum, customName) {
      const types = Object.keys(PLANT_ARCHETYPES);
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const archetype = getArch(chosenType);
      const randomReveal = Math.floor(Math.random() * (12 - 6 + 1)) + 6;

      return {
        id: Date.now(),
        slotName: customName || ('SLOT ' + (slotNum + 1)),
        type: chosenType,
        revealed: false,
        revealAge: randomReveal,
        age: 1.0,
        health: 100,
        isDead: false,
        potColor: ['#ea580c', '#d97706', '#059669', '#475569', '#7c3aed', '#0284c7'][slotNum % 6],
        conditions: { moisture: 50, sunlight: 50, temperature: 72, soilHealth: 85, infestation: 0 },
        ideals: {
          moisture: [archetype.moisture[0], archetype.moisture[1]], sunlight: [archetype.sunlight[0], archetype.sunlight[1]],
          temp: [archetype.temp[0], archetype.temp[1]], soil: [archetype.soil[0], archetype.soil[1]]
        }
      };
    }

    // Icons
    const DropletIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L12 2 L16 10 L18 14 L18 18 L16 22 L8 22 L6 18 L6 14 L8 10 Z"/></svg>;
    const SunIcon = () => <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8"/><rect x="11" y="2" width="2" height="4"/><rect x="11" y="18" width="2" height="4"/><rect x="2" y="11" width="4" height="2"/><rect x="18" y="11" width="4" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="18" y="18" width="2" height="2"/><rect x="4" y="18" width="2" height="2"/><rect x="18" y="4" width="2" height="2"/></svg>;
    const MoonIcon = () => <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="2" width="6" height="2"/><rect x="6" y="4" width="4" height="4"/><rect x="4" y="8" width="4" height="8"/><rect x="6" y="16" width="4" height="4"/><rect x="10" y="20" width="6" height="2"/><rect x="14" y="16" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><rect x="14" y="4" width="4" height="4"/></svg>;
    const ThermometerIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="2" width="4" height="14"/><rect x="8" y="14" width="8" height="8"/></svg>;
    const BugIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="6" width="8" height="12"/><rect x="4" y="8" width="4" height="2"/><rect x="16" y="8" width="4" height="2"/><rect x="4" y="14" width="4" height="2"/><rect x="16" y="14" width="4" height="2"/><rect x="10" y="2" width="1" height="4"/><rect x="13" y="2" width="1" height="4"/></svg>;
    const ShovelIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="14,2 22,2 22,10 12,20 4,20 4,12"/><rect x="4" y="14" width="6" height="6" fill="#111827"/></svg>;
    const SprayIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="14"/><rect x="10" y="4" width="4" height="4"/><rect x="4" y="4" width="6" height="2"/><rect x="2" y="4" width="2" height="6"/></svg>;
    const ScissorsIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><polygon points="10,10 20,2 20,6 12,12"/><polygon points="10,14 20,22 20,18 12,12"/><rect x="6" y="6" width="2" height="2" fill="#111827"/><rect x="6" y="16" width="2" height="2" fill="#111827"/></svg>;
    const PencilIcon = () => <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="16,2 22,8 8,22 2,22 2,16"/></svg>;
    const ArrowLeftIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="10,4 2,12 10,20 10,14 22,14 22,10 10,10"/></svg>;
    const TrashIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="16"/><rect x="4" y="4" width="16" height="2"/><rect x="10" y="2" width="4" height="2"/></svg>;

    // Core Plant Vector Graphic - Returns a native SVG <g>
    const PlantGraphic = ({ plant, isBlooming, soilBaseY = 168 }) => {
      if (!plant) return null;
      const arch = getArch(plant.type);
      const c = plant.conditions || {};
      const moisture = c.moisture ?? 50;
      const mMin = plant.ideals?.moisture?.[0] ?? 0;
      const mMax = plant.ideals?.moisture?.[1] ?? 100;
      
      const bodyCol = plant.isDead ? '#64748b' : plant.health < 35 && moisture < mMin ? '#d97706' : plant.health < 35 && moisture > mMax ? '#064e3b' : arch.color;
      const leafCol = plant.isDead ? '#475569' : plant.health < 35 && moisture < mMin ? '#f59e0b' : plant.health < 35 && moisture > mMax ? '#047857' : arch.leafColor;
      
      const growthProgress = Math.min((plant.age || 1) / 18, 1);
      const plantHeight = 24 + growthProgress * 70;
      const stemTopY = soilBaseY - plantHeight;
      const strokeW = 4;

      return (
        <g>
          {(c.infestation > 10) && (
            <g fill="#ff003c" className="bug-idle-anim">
              <rect x="85" y={soilBaseY - 30} width="4" height="4" /><rect x="115" y={soilBaseY - 45} width="4" height="4" />
              <rect x="102" y={soilBaseY - 60} width="4" height="4" /><rect x="75" y={soilBaseY - 15} width="4" height="4" />
            </g>
          )}

          <g className={plant.isDead ? '' : 'plant-idle-anim'}>
            {plant.isDead ? (
              <g stroke="#64748b" strokeWidth="6" fill="none"><polyline points="100,170 102,140 120,135 135,132 135,155" /><polyline points="112,140 125,150 120,162" /></g>
            ) : !plant.revealed ? (
              <g strokeWidth={strokeW}>
                <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={bodyCol} />
                <polyline points={`100,${stemTopY} 85,${stemTopY - 5} 78,${stemTopY}`} stroke={leafCol} fill="none"/>
                <polyline points={`100,${stemTopY} 115,${stemTopY - 5} 122,${stemTopY}`} stroke={leafCol} fill="none"/>
              </g>
            ) : plant.type === 'cactus' ? (
              <g>
                <rect x="88" y={stemTopY} width="24" height={plantHeight} fill={bodyCol} stroke="#000" strokeWidth={strokeW} />
                <line x1="84" y1={stemTopY + 20} x2="116" y2={stemTopY + 20} stroke="#ffea00" strokeWidth="2" />
                <line x1="84" y1={stemTopY + 45} x2="116" y2={stemTopY + 45} stroke="#ffea00" strokeWidth="2" />
                {plant.age >= 10 && <polyline points={`88,${stemTopY + 35} 75,${stemTopY + 35} 75,${stemTopY + 15} 82,${stemTopY + 15}`} stroke={bodyCol} strokeWidth="8" fill="none" />}
                {plant.age >= 13 && <polyline points={`112,${stemTopY + 48} 125,${stemTopY + 48} 125,${stemTopY + 28} 118,${stemTopY + 28}`} stroke={bodyCol} strokeWidth="8" fill="none" />}
                {isBlooming && <rect x="94" y={stemTopY - 12} width="12" height="12" fill="#ff003c" className="flower-anim" />}
              </g>
            ) : plant.type === 'succulent' ? (
              <g fill={leafCol} stroke="#000" strokeWidth="2">
                <rect x="66" y={soilBaseY - 20} width="68" height="20" /><rect x="76" y={soilBaseY - 30} width="48" height="18" /><rect x="86" y={soilBaseY - 40} width="28" height="16" fill={bodyCol} />
                {isBlooming && (<g className="flower-anim"><polyline points={`100,${soilBaseY - 30} 118,${soilBaseY - 60} 122,${soilBaseY - 80}`} stroke="#16a34a" strokeWidth="4" fill="none" /><rect x="118" y={soilBaseY - 84} width="8" height="8" fill="#ffea00" /></g>)}
              </g>
            ) : plant.type === 'fern' ? (
              <g stroke={bodyCol} fill="none" strokeWidth={strokeW}>
                <line x1="100" y1={soilBaseY} x2="98" y2={stemTopY} />
                {[0.25, 0.5, 0.75, 1.0].map((frac, idx) => {
                  const yPos = soilBaseY - plantHeight * frac; const spread = 20 + frac * 16;
                  return (
                    <g key={idx}>
                      <polyline points={`100,${yPos} ${100 - spread},${yPos - 10} ${100 - spread - 4},${yPos + 4}`} stroke={leafCol} />
                      <polyline points={`100,${yPos} ${100 + spread},${yPos - 10} ${100 + spread + 4},${yPos + 4}`} stroke={leafCol} />
                    </g>
                  );
                })}
                {isBlooming && (<g fill="#0284c7" stroke="none" className="flower-anim"><rect x="68" y={stemTopY + 16} width="6" height="6" /><rect x="126" y={stemTopY + 20} width="6" height="6" /><rect x="96" y={stemTopY - 4} width="8" height="8" fill="#fff" /></g>)}
              </g>
            ) : plant.type === 'bonsai' ? (
              <g>
                <polyline points={`100,${soilBaseY} 94,${soilBaseY - 20} 114,${soilBaseY - 42} 98,${stemTopY}`} stroke={bodyCol} strokeWidth="10" strokeLinecap="square" fill="none" />
                <line x1="110" y1={soilBaseY - 32} x2="132" y2={soilBaseY - 38} stroke={bodyCol} strokeWidth="6" />
                <line x1="96" y1={soilBaseY - 45} x2="72" y2={soilBaseY - 50} stroke={bodyCol} strokeWidth="6" />
                <rect x="60" y={soilBaseY - 58} width="36" height="12" fill={leafCol} stroke="#000" strokeWidth="2" />
                <rect x="116" y={soilBaseY - 46} width="32" height="12" fill={leafCol} stroke="#000" strokeWidth="2" />
                <rect x="80" y={stemTopY - 8} width="42" height="14" fill={leafCol} stroke="#000" strokeWidth="2" />
                {isBlooming && (<g className="flower-anim"><rect x="76" y={soilBaseY - 64} width="6" height="6" fill="#f472b6" /><rect x="126" y={soilBaseY - 52} width="6" height="6" fill="#f472b6" /><rect x="98" y={stemTopY - 14} width="8" height="8" fill="#f472b6" /></g>)}
              </g>
            ) : plant.type === 'flytrap' ? (
              <g>
                <polyline points={`100,${soilBaseY} 82,${stemTopY + 24} 66,${stemTopY}`} stroke={leafCol} strokeWidth="4" fill="none" />
                <polyline points={`100,${soilBaseY} 118,${stemTopY + 24} 134,${stemTopY}`} stroke={leafCol} strokeWidth="4" fill="none" />
                <polyline points={`100,${soilBaseY} 100,${stemTopY + 12}`} stroke={leafCol} strokeWidth="4" fill="none" />
                <rect x="52" y={stemTopY - 12} width="24" height="16" fill={bodyCol} stroke="#000" strokeWidth="2" />
                <polyline points={`52,${stemTopY - 12} 56,${stemTopY - 18} 60,${stemTopY - 12} 64,${stemTopY - 18} 68,${stemTopY - 12} 72,${stemTopY - 18} 76,${stemTopY - 12}`} stroke="#fff" strokeWidth="2" fill="none" />
                <rect x="124" y={stemTopY - 12} width="24" height="16" fill={bodyCol} stroke="#000" strokeWidth="2" />
                <polyline points={`124,${stemTopY - 12} 128,${stemTopY - 18} 132,${stemTopY - 12} 136,${stemTopY - 18} 140,${stemTopY - 12} 144,${stemTopY - 18} 148,${stemTopY - 12}`} stroke="#fff" strokeWidth="2" fill="none" />
                <rect x="88" y={stemTopY} width="24" height="14" fill={bodyCol} stroke="#000" strokeWidth="2" />
                <polyline points={`88,${stemTopY} 92,${stemTopY - 6} 96,${stemTopY} 100,${stemTopY - 6} 104,${stemTopY} 108,${stemTopY - 6} 112,${stemTopY}`} stroke="#fff" strokeWidth="2" fill="none" />
                {isBlooming && (<g className="flower-anim"><line x1="100" y1={soilBaseY - 20} x2="100" y2={stemTopY - 24} stroke="#16a34a" strokeWidth="2" /><rect x="96" y={stemTopY - 30} width="8" height="8" fill="#ffffff" /><rect x="98" y={stemTopY - 28} width="4" height="4" fill="#facc15" /></g>)}
              </g>
            ) : plant.type === 'orchid' ? (
              <g>
                <polygon points={`100,${soilBaseY} 60,${soilBaseY - 8} 68,${soilBaseY - 18} 100,${soilBaseY - 10}`} fill={leafCol} stroke="#000" strokeWidth="2" />
                <polygon points={`100,${soilBaseY} 140,${soilBaseY - 8} 132,${soilBaseY - 18} 100,${soilBaseY - 10}`} fill={leafCol} stroke="#000" strokeWidth="2" />
                <polyline points={`100,${soilBaseY} 96,${soilBaseY - 35} 106,${soilBaseY - 70} 122,${stemTopY}`} stroke={leafCol} strokeWidth="3" fill="none" />
                <rect x="114" y={stemTopY - 6} width="16" height="16" fill={bodyCol} stroke="#000" strokeWidth="2" /><rect x="119" y={stemTopY - 1} width="6" height="6" fill="#fef08a" />
                {plant.age >= 9 && (<g><rect x="98" y={soilBaseY - 55} width="14" height="14" fill={bodyCol} stroke="#000" strokeWidth="2" /><rect x="103" y={soilBaseY - 51} width="4" height="4" fill="#fef08a" /></g>)}
                {isBlooming && (<g className="flower-anim"><rect x="126" y={stemTopY - 2} width="6" height="6" fill="#fae8ff" /><rect x="110" y={stemTopY - 2} width="6" height="6" fill="#fae8ff" /></g>)}
              </g>
            ) : plant.type === 'snake' ? (
              <g>
                <polygon points={`100,${soilBaseY} 88,${stemTopY + 10} 98,${stemTopY - 15} 106,${stemTopY + 15}`} fill={leafCol} stroke={bodyCol} strokeWidth="4" />
                <polygon points={`90,${soilBaseY} 74,${stemTopY + 30} 82,${stemTopY + 10} 92,${stemTopY + 30}`} fill={leafCol} stroke={bodyCol} strokeWidth="3" />
                <polygon points={`110,${soilBaseY} 124,${stemTopY + 35} 118,${stemTopY + 15} 108,${stemTopY + 35}`} fill={leafCol} stroke={bodyCol} strokeWidth="3" />
                <line x1="94" y1={stemTopY + 15} x2="102" y2={stemTopY + 15} stroke={bodyCol} strokeWidth="2" /><line x1="92" y1={stemTopY + 35} x2="104" y2={stemTopY + 35} stroke={bodyCol} strokeWidth="2" /><line x1="90" y1={stemTopY + 55} x2="106" y2={stemTopY + 55} stroke={bodyCol} strokeWidth="2" />
                {isBlooming && (<g className="flower-anim"><rect x="96" y={stemTopY - 24} width="8" height="8" fill="#fef08a" /></g>)}
              </g>
            ) : plant.type === 'bamboo' ? (
              <g>
                <rect x="92" y={stemTopY} width="8" height={plantHeight} fill={bodyCol} stroke="#000" strokeWidth="2" />
                <line x1="90" y1={stemTopY + 25} x2="102" y2={stemTopY + 25} stroke="#1e293b" strokeWidth="2" /><line x1="90" y1={stemTopY + 50} x2="102" y2={stemTopY + 50} stroke="#1e293b" strokeWidth="2" /><line x1="90" y1={stemTopY + 75} x2="102" y2={stemTopY + 75} stroke="#1e293b" strokeWidth="2" />
                <rect x="104" y={stemTopY + 20} width="7" height={plantHeight - 20} fill={bodyCol} stroke="#000" strokeWidth="2" />
                <line x1="102" y1={stemTopY + 45} x2="113" y2={stemTopY + 45} stroke="#1e293b" strokeWidth="2" /><line x1="102" y1={stemTopY + 70} x2="113" y2={stemTopY + 70} stroke="#1e293b" strokeWidth="2" />
                <polyline points={`92,${stemTopY + 5} 74,${stemTopY - 10} 70,${stemTopY}`} stroke={leafCol} strokeWidth="3" fill="none" />
                <polyline points={`100,${stemTopY + 5} 115,${stemTopY - 12} 120,${stemTopY}`} stroke={leafCol} strokeWidth="3" fill="none" />
                <polyline points={`108,${stemTopY + 25} 126,${stemTopY + 12} 130,${stemTopY + 20}`} stroke={leafCol} strokeWidth="3" fill="none" />
                {isBlooming && (<g className="flower-anim"><rect x="88" y={stemTopY + 34} width="26" height="6" fill="#ef4444" /><polygon points={`101,${stemTopY + 40} 95,${stemTopY + 50} 107,${stemTopY + 50}`} fill="#ef4444" /></g>)}
              </g>
            ) : plant.type === 'sunflower' ? (
              <g>
                <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={leafCol} strokeWidth="5" />
                <polygon points={`100,${soilBaseY - plantHeight * 0.4} 72,${soilBaseY - plantHeight * 0.45} 78,${soilBaseY - plantHeight * 0.32}`} fill={leafCol} stroke="#000" strokeWidth="2" />
                <polygon points={`100,${soilBaseY - plantHeight * 0.6} 128,${soilBaseY - plantHeight * 0.65} 122,${soilBaseY - plantHeight * 0.52}`} fill={leafCol} stroke="#000" strokeWidth="2" />
                <rect x="88" y={stemTopY - 12} width="24" height="24" fill={bodyCol} stroke="#000" strokeWidth="2" />
                <rect x="94" y={stemTopY - 18} width="12" height="6" fill="#facc15" /><rect x="94" y={stemTopY + 12} width="12" height="6" fill="#facc15" />
                <rect x="82" y={stemTopY - 6} width="6" height="12" fill="#facc15" /><rect x="112" y={stemTopY - 6} width="6" height="12" fill="#facc15" />
                <rect x="94" y={stemTopY - 6} width="12" height="12" fill="#451a03" />
                {isBlooming && (<g className="flower-anim"><rect x="84" y={stemTopY - 16} width="6" height="6" fill="#facc15" /><rect x="110" y={stemTopY - 16} width="6" height="6" fill="#facc15" /><rect x="84" y={stemTopY + 10} width="6" height="6" fill="#facc15" /><rect x="110" y={stemTopY + 10} width="6" height="6" fill="#facc15" /></g>)}
              </g>
            ) : (
              <g>
                <g fill={leafCol} stroke="#000" strokeWidth="2">
                  <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={bodyCol} strokeWidth="4" />
                  <polygon points={`100,${soilBaseY - plantHeight * 0.4} 70,${soilBaseY - plantHeight * 0.5} 62,${soilBaseY - plantHeight * 0.35} 80,${soilBaseY - plantHeight * 0.28}`} />
                  <polygon points={`100,${soilBaseY - plantHeight * 0.65} 130,${soilBaseY - plantHeight * 0.75} 138,${soilBaseY - plantHeight * 0.6} 120,${soilBaseY - plantHeight * 0.52}`} />
                  <polygon points={`100,${stemTopY} 85,${stemTopY - 20} 100,${stemTopY - 25} 115,${stemTopY - 20}`} />
                </g>
                {isBlooming && (<g className="flower-anim"><polyline points={`98,${soilBaseY - 15} 84,${soilBaseY - 50} 80,${soilBaseY - 75}`} stroke="#16a34a" strokeWidth="4" fill="none" /><rect x="72" y={soilBaseY - 86} width="16" height="20" fill="#fff" stroke="#000" strokeWidth="2" /><rect x="78" y={soilBaseY - 82} width="4" height="12" fill="#ffea00" /></g>)}
              </g>
            )}
          </g>

          {/* Pot & Soil - Base centered at (100, 214) */}
          <rect x="58" y="163" width="84" height="14" fill="#3e2723" stroke="#000" strokeWidth="2" />
          <polygon points="60,170 70,214 130,214 140,170" fill={plant.potColor || '#ea580c'} stroke="#000" strokeWidth="2" />
        </g>
      );
    };

    // Wrapper for Main Gameplay Viewport
    const PlantVisual = ({ plant, isBlooming }) => (
      <svg viewBox="0 0 200 215" className="w-full h-full max-h-full overflow-visible pixelated" preserveAspectRatio="xMidYMid meet">
        <PlantGraphic plant={plant} isBlooming={isBlooming} />
      </svg>
    );

    // Exact Mathematical Shelving Coordinates: (100, 214) maps flush to (spot.x, spot.y)
    // Row 1: Top Hanging Shelf (Plank Surface at Y = 192)
    // Row 2: Middle Window Ledge (Sill Surface at Y = 366)
    // Row 3: Sunroom Floor (Floor Surface at Y = 550)
    const SCENE_SPOTS = [
      { x: 65,  y: 192, scale: 0.38, plateY: 194 },
      { x: 180, y: 192, scale: 0.38, plateY: 194 },
      { x: 295, y: 192, scale: 0.38, plateY: 194 },
      { x: 65,  y: 366, scale: 0.50, plateY: 369 },
      { x: 180, y: 366, scale: 0.50, plateY: 369 },
      { x: 295, y: 366, scale: 0.50, plateY: 369 },
      { x: 65,  y: 550, scale: 0.65, plateY: 553 },
      { x: 180, y: 550, scale: 0.65, plateY: 553 },
      { x: 295, y: 550, scale: 0.65, plateY: 553 }
    ];

    function App() {
      const [screen, setScreen] = useState('home');
      const [activeSlot, setActiveSlot] = useState(0);
      const [slotsData, setSlotsData] = useState(() => [safeLoadSlot(0), safeLoadSlot(1), safeLoadSlot(2)]);
      const [plant, setPlant] = useState(null);
      
      const [sunroomData, setSunroomData] = useState(() => {
        try {
          const raw = localStorage.getItem('plant_sunroom');
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) { return []; }
      });
      
      const [toast, setToast] = useState('');
      const [nameModal, setNameModal] = useState({ open: false, slotIndex: 0, currentName: '', isNew: false });
      const [revealModal, setRevealModal] = useState({ open: false, plantType: null });
      const [tutorialOpen, setTutorialOpen] = useState(false);
      const [inspectedPlant, setInspectedPlant] = useState(null);
      
      const [darkMode, setDarkMode] = useState(() => {
        try { return localStorage.getItem('plant_dark_mode') !== 'false'; } catch (e) { return true; }
      });

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        try { localStorage.setItem('plant_dark_mode', darkMode); } catch (e) {}
      }, [darkMode]);

      useEffect(() => {
        if (!plant) return;
        try { localStorage.setItem('plant_slot_' + activeSlot, JSON.stringify(plant)); } catch (e) {}
        setSlotsData(prev => { const next = [...prev]; next[activeSlot] = plant; return next; });
      }, [plant, activeSlot]);

      useEffect(() => {
        try { localStorage.setItem('plant_sunroom', JSON.stringify(sunroomData)); } catch (e) {}
      }, [sunroomData]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };

      // Game Loop
      useEffect(() => {
        if (screen !== 'game' || !plant || plant.isDead || revealModal.open || tutorialOpen) return;

        const interval = setInterval(() => {
          setPlant(prev => {
            if (!prev || prev.isDead) return prev;
            let c = prev.conditions || {};
            let moisture = c.moisture ?? 50; let sunlight = c.sunlight ?? 50; let temperature = c.temperature ?? 72;
            let soilHealth = c.soilHealth ?? 85; let infestation = c.infestation ?? 0;
            let healthDelta = 0;

            const moistureDrain = 1.0 + (temperature > 80 ? 0.8 : 0) + (sunlight > 75 ? 0.6 : 0);
            moisture = Math.max(0, Math.min(100, moisture - moistureDrain));
            soilHealth = Math.max(0, Math.min(100, soilHealth - 0.25));

            if (soilHealth < 40 || moisture > 85) { if (Math.random() < 0.35) infestation = Math.min(100, infestation + 4); }

            const idls = prev.ideals || { moisture: [0, 100], sunlight: [0, 100], temp: [0, 100], soil: [0, 100] };
            const mMin = idls.moisture[0]; const mMax = idls.moisture[1];
            const sMin = idls.sunlight[0]; const sMax = idls.sunlight[1];
            const tMin = idls.temp[0]; const tMax = idls.temp[1];
            const soilMin = idls.soil[0];

            if (moisture < mMin) healthDelta -= (mMin - moisture) * 0.15; else if (moisture > mMax) healthDelta -= (moisture - mMax) * 0.15; else healthDelta += 0.5;
            if (sunlight < sMin) healthDelta -= (sMin - sunlight) * 0.12; else if (sunlight > sMax) healthDelta -= (sunlight - sMax) * 0.12; else healthDelta += 0.4;
            if (temperature < tMin) healthDelta -= (tMin - temperature) * 0.18; else if (temperature > tMax) healthDelta -= (temperature - tMax) * 0.18;
            if (soilHealth < soilMin) healthDelta -= 1.2;
            if (infestation > 15) healthDelta -= (infestation - 15) * 0.22;

            const newHealth = Math.max(0, Math.min(100, (prev.health || 100) + healthDelta));
            const isDead = newHealth <= 0;

            let newAge = prev.age || 1; let newlyRevealed = false; let newRevealedState = prev.revealed;

            if (!isDead && newHealth > 40) {
              newAge = +(newAge + 0.15).toFixed(2);
              if (!prev.revealed && newAge >= (prev.revealAge || 6)) { newRevealedState = true; newlyRevealed = true; }
            }

            if (newlyRevealed) setRevealModal({ open: true, plantType: prev.type });

            return {
              ...prev, age: newAge, health: Math.round(newHealth), revealed: newRevealedState, isDead: isDead,
              conditions: { moisture: Math.round(moisture), sunlight, temperature, soilHealth: Math.round(soilHealth), infestation: Math.round(infestation) }
            };
          });
        }, 3000);

        return () => clearInterval(interval);
      }, [screen, plant ? plant.isDead : false, revealModal.open, tutorialOpen]);

      const applyCare = (action) => {
        if (!plant || plant.isDead) return;
        setPlant(prev => {
          let c = { ...prev.conditions }; let h = prev.health;
          switch (action) {
            case 'water': c.moisture = Math.min(100, c.moisture + 22); if (c.infestation > 0) c.infestation = Math.max(0, c.infestation - 4); showToast('+H2O'); break;
            case 'fertilize': c.soilHealth = Math.min(100, c.soilHealth + 26); showToast('+SOIL'); break;
            case 'sun_up': c.sunlight = Math.min(100, c.sunlight + 15); showToast('+SUN'); break;
            case 'sun_down': c.sunlight = Math.max(0, c.sunlight - 15); showToast('-SUN'); break;
            case 'temp_up': c.temperature = Math.min(105, c.temperature + 4); showToast('+HEAT'); break;
            case 'temp_down': c.temperature = Math.max(40, c.temperature - 4); showToast('-HEAT'); break;
            case 'spray': c.infestation = Math.max(0, c.infestation - 45); c.soilHealth = Math.max(0, c.soilHealth - 6); showToast('PESTS CLR'); break;
            case 'prune': h = Math.min(100, h + 8); showToast('+HP'); break;
          }
          return { ...prev, health: h, conditions: c };
        });
      };

      const handleSaveName = (enteredName) => {
        const finalName = enteredName.trim().toUpperCase() || ('SLOT ' + (nameModal.slotIndex + 1));
        if (nameModal.isNew) {
          const fresh = generateNewPlant(nameModal.slotIndex, finalName);
          setPlant(fresh); setActiveSlot(nameModal.slotIndex);
          try { localStorage.setItem('plant_slot_' + nameModal.slotIndex, JSON.stringify(fresh)); } catch (e) {}
          setSlotsData(prev => { const next = [...prev]; next[nameModal.slotIndex] = fresh; return next; });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false }); setScreen('game');
        } else {
          if (plant && activeSlot === nameModal.slotIndex) setPlant(prev => ({ ...prev, slotName: finalName }));
          setSlotsData(prev => {
            const next = [...prev];
            if (next[nameModal.slotIndex]) {
              next[nameModal.slotIndex] = { ...next[nameModal.slotIndex], slotName: finalName };
              try { localStorage.setItem('plant_slot_' + nameModal.slotIndex, JSON.stringify(next[nameModal.slotIndex])); } catch (e) {}
            }
            return next;
          });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false });
        }
      };

      const retirePlant = () => {
        if (sunroomData.length >= 9) { showToast("SUNROOM FULL!"); return; }
        if (confirm(`RETIRE ${(plant.slotName || 'PLANT')} TO SUNROOM?`)) {
          setSunroomData(prev => [...prev, plant]);
          try { localStorage.removeItem('plant_slot_' + activeSlot); } catch (err) {}
          setSlotsData(prev => { const next = [...prev]; next[activeSlot] = null; return next; });
          setPlant(null); setScreen('sunroom');
        }
      };

      const deleteSlot = (slotIdx, e) => {
        e.stopPropagation();
        if (confirm('ERASE SLOT ' + (slotIdx + 1) + '?')) {
          try { localStorage.removeItem('plant_slot_' + slotIdx); } catch (err) {}
          setSlotsData(prev => { const next = [...prev]; next[slotIdx] = null; return next; });
          if (activeSlot === slotIdx) setPlant(null);
        }
      };

      const getBarColor = (val, min, max, isPest) => {
        if (isPest) return val <= 15 ? 'bg-retro-green dark:bg-retro-neonGreen' : val <= 40 ? 'bg-amber-500 dark:bg-retro-yellow' : 'bg-retro-red';
        if (val >= min && val <= max) return 'bg-retro-green dark:bg-retro-neonGreen';
        return Math.min(Math.abs(val - min), Math.abs(val - max)) <= 12 ? 'bg-amber-500 dark:bg-retro-yellow' : 'bg-retro-red';
      };

      const isBlooming = plant && !plant.isDead && plant.age >= 6 && plant.health >= 55;
      const canRetire = plant && !plant.isDead && plant.age >= 20 && plant.revealed;

      return (
        <div className="h-full w-full max-w-md mx-auto flex flex-col justify-between overflow-hidden p-3 box-border">
          
          {/* ======================= SCREEN 1: TITLE / HOME ======================= */}
          {screen === 'home' && (
            <div className="h-full flex flex-col justify-between py-2">
              <div className="flex justify-between items-center px-1 py-1">
                <span className="text-[10px] text-emerald-700 dark:text-retro-neonGreen font-bold">POCKET GARDEN</span>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => setTutorialOpen(true)} className="retro-btn bg-white dark:bg-black text-amber-600 dark:text-retro-yellow px-2 py-1 text-[8px] hover:text-black dark:hover:text-white font-bold">? GUIDE</button>
                  <button onClick={() => setDarkMode(!darkMode)} className="retro-btn bg-white dark:bg-black text-slate-800 dark:text-white p-1 text-[8px] flex items-center justify-center">
                    {darkMode ? <SunIcon /> : <MoonIcon />}
                  </button>
                </div>
              </div>

              <div className="flex flex-col items-center my-auto text-center px-4">
                <div className="w-16 h-16 mb-4 bg-emerald-100 dark:bg-black text-emerald-600 dark:text-retro-neonGreen flex items-center justify-center border-4 border-slate-800 dark:border-retro-neonGreen shadow-[4px_4px_0px_0px_#000] dark:shadow-[4px_4px_0px_0px_#39ff14]">
                  <DropletIcon />
                </div>
                <h1 className="text-xl leading-relaxed text-emerald-800 dark:text-retro-neonGreen drop-shadow-xs dark:drop-shadow-[2px_2px_0px_#000]">TINY PLANT<br/>SIM 1.2</h1>
              </div>

              <div className="space-y-3 mb-4">
                {[0, 1, 2].map((idx) => {
                  const data = slotsData[idx];
                  return (
                    <div key={idx} className="retro-panel flex items-center justify-between p-3">
                      {data ? (
                        <div className="flex-1 min-w-0 pr-2">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] text-blue-700 dark:text-retro-blue truncate font-bold">{data.slotName || ('SLOT ' + (idx + 1))}</span>
                            <button onClick={() => setNameModal({ open: true, slotIndex: idx, currentName: data.slotName || '', isNew: false })} className="text-slate-400 dark:text-retro-border hover:text-black dark:hover:text-white"><PencilIcon /></button>
                          </div>
                          <div className="flex flex-col gap-1 mt-2 text-[8px] text-slate-500 dark:text-retro-border">
                            <span>{data.isDead ? 'WITHERED' : data.revealed ? getArch(data.type).name : 'MYSTERY SEED'}</span>
                            <span>DAY {Math.floor(data.age || 1)} • <span className={data.isDead ? 'text-retro-red font-bold' : 'text-emerald-600 dark:text-retro-neonGreen font-bold'}>{data.isDead ? 'DEAD' : ((data.health || 0) + '% HP')}</span></span>
                          </div>
                        </div>
                      ) : (
                        <div className="flex-1 min-w-0"><span className="text-[10px] text-slate-400 dark:text-retro-border">FILE {idx + 1} : EMPTY</span></div>
                      )}
                      <div className="flex items-center gap-2 shrink-0">
                        {data ? (
                          <>
                            <button onClick={() => { setActiveSlot(idx); setPlant(data); setScreen('game'); }} className="retro-btn bg-emerald-500 dark:bg-retro-neonGreen text-black px-2 py-2 text-[8px] font-bold">PLAY</button>
                            <button onClick={(e) => deleteSlot(idx, e)} className="retro-btn bg-retro-red text-white p-2"><TrashIcon /></button>
                          </>
                        ) : (
                          <button onClick={() => setNameModal({ open: true, slotIndex: idx, currentName: ('SLOT ' + (idx + 1)), isNew: true })} className="retro-btn bg-slate-100 dark:bg-retro-panel text-slate-800 dark:text-white px-2 py-2 text-[8px] font-bold">NEW</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={() => setScreen('sunroom')} className="retro-btn w-full bg-purple-600 dark:bg-purple-700 text-white py-3 text-[10px] mb-2 font-bold flex justify-center items-center gap-2">
                <SunIcon /> VISIT SUNROOM ({sunroomData.length}/9)
              </button>
              <footer className="text-center text-[8px] text-slate-500 dark:text-retro-border">© 2026 RETRO STUDIOS</footer>
            </div>
          )}

          {/* ======================= SCREEN 2: GAMEPLAY ======================= */}
          {screen === 'game' && plant && (
            <div className="h-full flex flex-col justify-between overflow-hidden">
              <div className="shrink-0 space-y-2 pb-1">
                <div className="flex items-center justify-between py-1 border-b-4 border-slate-300 dark:border-retro-panel">
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => setScreen('home')} className="retro-btn bg-white dark:bg-retro-panel text-slate-900 dark:text-white px-2 py-1.5 text-[8px] flex items-center gap-1 font-bold"><ArrowLeftIcon /> BACK</button>
                  </div>
                  <div className="flex items-center gap-2 max-w-[120px] truncate">
                    <span className="text-[10px] text-blue-700 dark:text-retro-blue truncate font-bold">{plant.slotName}</span>
                    <button onClick={() => setNameModal({ open: true, slotIndex: activeSlot, currentName: plant.slotName, isNew: false })} className="text-slate-400 dark:text-retro-border hover:text-black dark:hover:text-white"><PencilIcon /></button>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {canRetire && (<button onClick={retirePlant} className="retro-btn bg-amber-500 dark:bg-retro-yellow text-black px-1.5 py-1 text-[8px] font-bold animate-pulse">RETIRE</button>)}
                    <span className={'text-[10px] px-2 py-1 border-2 border-current bg-white dark:bg-black font-bold ' + (plant.isDead ? 'text-retro-red' : plant.health > 70 ? 'text-emerald-600 dark:text-retro-neonGreen' : plant.health > 35 ? 'text-amber-500 dark:text-retro-yellow' : 'text-retro-red')}>{plant.isDead ? 'DEAD' : ('HP:' + plant.health)}</span>
                  </div>
                </div>
                <div className="flex justify-between items-center px-1 pt-1">
                  <span className="text-[10px] text-slate-800 dark:text-white font-bold">{plant.isDead ? 'WITHERED' : plant.revealed ? getArch(plant.type).name : 'MYSTERY SEED'}</span>
                  <span className="text-[10px] text-slate-500 dark:text-retro-border font-bold">DAY {Math.floor(plant.age)}</span>
                </div>
              </div>

              <div className="flex-1 min-h-0 grid grid-cols-12 gap-3 my-2 items-stretch retro-panel p-2">
                <div className="col-span-7 h-full flex flex-col items-center justify-center relative bg-slate-100 dark:bg-black border-4 border-slate-700 dark:border-retro-border overflow-hidden">
                  <PlantVisual plant={plant} isBlooming={isBlooming} />
                </div>
                <div className="col-span-5 flex flex-col justify-between py-1 px-1">
                  {['moisture', 'sunlight', 'temperature', 'soilHealth', 'infestation'].map((cond, i) => {
                    const labels = ['H2O', 'SUN', 'TMP', 'DIRT', 'BUG']; const icons = [<DropletIcon key={1}/>, <SunIcon key={2}/>, <ThermometerIcon key={3}/>, <ShovelIcon key={4}/>, <BugIcon key={5}/>];
                    const c = plant.conditions || {}; const idls = plant.ideals || { moisture: [0, 100], sunlight: [0, 100], temp: [0, 100], soil: [0, 100] };
                    const val = c[cond] ?? (cond === 'infestation' ? 0 : 50); const lookup = cond === 'temperature' ? 'temp' : cond === 'soilHealth' ? 'soil' : cond;
                    const range = cond === 'infestation' ? [0, 15] : (idls[lookup] || [0, 100]); const barW = cond === 'temperature' ? Math.min(100, Math.max(0, (val - 40) * 1.5)) : val;
                    return (
                      <div key={cond}>
                        <div className="flex justify-between items-center text-[8px] mb-1">
                          <span className="flex items-center gap-1 font-bold">{icons[i]} {labels[i]}</span><span className="font-bold">{val}{cond === 'temperature' ? '°' : '%'}</span>
                        </div>
                        <div className="w-full bg-slate-200 dark:bg-black border-2 border-slate-600 dark:border-retro-border h-3">
                          <div className={'h-full ' + getBarColor(val, range[0], range[1] || 100, cond === 'infestation')} style={{ width: `${barW}%` }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="shrink-0 space-y-2 pb-1">
                <div className="h-6 flex items-center justify-center">
                  {toast && (<span className="text-[8px] text-black bg-emerald-400 dark:bg-retro-neonGreen px-2 py-1 border-2 border-black dark:border-white shadow-[2px_2px_0_0_#000] font-bold">{toast}</span>)}
                </div>
                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => applyCare('water')} disabled={plant.isDead} className="retro-btn bg-blue-600 text-white py-2 flex flex-col items-center"><DropletIcon /><span className="text-[7px] mt-2 font-bold">WATER</span></button>
                  <button onClick={() => applyCare('fertilize')} disabled={plant.isDead} className="retro-btn bg-amber-600 text-white py-2 flex flex-col items-center"><ShovelIcon /><span className="text-[7px] mt-2 font-bold">FEED</span></button>
                  <button onClick={() => applyCare('spray')} disabled={plant.isDead} className="retro-btn bg-rose-600 text-white py-2 flex flex-col items-center"><SprayIcon /><span className="text-[7px] mt-2 font-bold">SPRAY</span></button>
                  <button onClick={() => applyCare('prune')} disabled={plant.isDead} className="retro-btn bg-emerald-600 text-white py-2 flex flex-col items-center"><ScissorsIcon /><span className="text-[7px] mt-2 font-bold">PRUNE</span></button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1 font-bold"><SunIcon /> SUN</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('sun_down')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">-</button>
                      <button onClick={() => applyCare('sun_up')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">+</button>
                    </div>
                  </div>
                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1 font-bold"><ThermometerIcon /> TMP</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('temp_down')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">-</button>
                      <button onClick={() => applyCare('temp_up')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">+</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ======================= SCREEN 3: 8-BIT SCENE SUNROOM ======================= */}
          {screen === 'sunroom' && (
            <div className="h-full flex flex-col relative overflow-hidden bg-black border-4 border-slate-700 dark:border-retro-border">
              
              {/* Back & Info Bar */}
              <div className="absolute top-2 left-2 z-50 flex items-center gap-2">
                <button onClick={() => setScreen('home')} className="retro-btn bg-white dark:bg-retro-panel text-slate-900 dark:text-white px-2 py-1.5 text-[8px] flex items-center gap-1 font-bold">
                  <ArrowLeftIcon /> BACK
                </button>
                <span className="text-[8px] bg-black/80 px-2 py-1 text-retro-yellow font-bold border border-retro-yellow/40">
                  {sunroomData.length}/9 RETIRED
                </span>
              </div>

              {/* Pixel Art Scene Container */}
              <svg viewBox="0 0 360 600" className="w-full h-full pixelated select-none" preserveAspectRatio="xMidYMid meet">
                <defs>
                  {/* Sunset Sky Gradient */}
                  <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#bed5b8" />
                    <stop offset="35%" stopColor="#dbe4bd" />
                    <stop offset="60%" stopColor="#f7cf88" />
                    <stop offset="85%" stopColor="#f39c5b" />
                    <stop offset="100%" stopColor="#e57a3e" />
                  </linearGradient>

                  {/* Pixelated Window Dither Pattern */}
                  <pattern id="pixelDither" width="4" height="4" patternUnits="userSpaceOnUse">
                    <rect width="2" height="2" fill="#243f48" />
                    <rect x="2" y="2" width="2" height="2" fill="#243f48" />
                  </pattern>
                </defs>

                {/* 1. SKY BACKGROUND */}
                <rect x="0" y="0" width="360" height="420" fill="url(#sunsetSky)" />

                {/* Horizontal Atmospheric Cloud Bands */}
                <rect x="0" y="45" width="160" height="4" fill="#a8c6a0" opacity="0.6" />
                <rect x="220" y="35" width="140" height="4" fill="#a8c6a0" opacity="0.6" />
                <rect x="40" y="75" width="200" height="5" fill="#cddcb8" opacity="0.5" />
                <rect x="180" y="110" width="180" height="6" fill="#fbe1a7" opacity="0.7" />
                <rect x="10" y="145" width="150" height="5" fill="#fbe1a7" opacity="0.7" />
                <rect x="120" y="175" width="220" height="6" fill="#f7b77f" opacity="0.6" />
                <rect x="0" y="210" width="180" height="5" fill="#f19456" opacity="0.6" />

                {/* 2. DISTANT AMBER SKYLINE */}
                <g fill="#e09051">
                  <rect x="20" y="260" width="35" height="100" />
                  <rect x="65" y="240" width="28" height="120" />
                  <polygon points="79,225 74,240 84,240" />
                  <rect x="105" y="270" width="40" height="90" />
                  <rect x="160" y="235" width="30" height="130" />
                  <rect x="200" y="255" width="45" height="105" />
                  <rect x="260" y="230" width="38" height="130" />
                  <polygon points="279,212 274,230 284,230" />
                  <rect x="310" y="250" width="40" height="110" />
                </g>

                {/* 3. TELEGRAPH WIRES & BIRDS */}
                <line x1="0" y1="130" x2="360" y2="130" stroke="#1c2d35" strokeWidth="2" />
                <line x1="0" y1="148" x2="360" y2="148" stroke="#1c2d35" strokeWidth="2" />
                <line x1="0" y1="215" x2="360" y2="215" stroke="#1c2d35" strokeWidth="2" />

                {/* Bird 1 (Left on Wire) */}
                <g transform="translate(110, 114)">
                  <polygon points="12,0 18,2 20,6 16,10 6,14 0,16 6,10 8,4" fill="#355c68" />
                  <rect x="14" y="2" width="2" height="2" fill="#fef08a" />
                  <polygon points="8,6 14,6 12,12 4,14" fill="#78350f" />
                  <line x1="10" y1="14" x2="10" y2="16" stroke="#000" strokeWidth="2" />
                  <line x1="14" y1="14" x2="14" y2="16" stroke="#000" strokeWidth="2" />
                </g>

                {/* Bird 2 (Right on Wire) */}
                <g transform="translate(225, 114)">
                  <polygon points="12,0 18,2 20,6 16,10 6,14 0,16 6,10 8,4" fill="#355c68" />
                  <rect x="14" y="2" width="2" height="2" fill="#fef08a" />
                  <polygon points="8,6 14,6 12,12 4,14" fill="#78350f" />
                  <line x1="10" y1="14" x2="10" y2="16" stroke="#000" strokeWidth="2" />
                  <line x1="14" y1="14" x2="14" y2="16" stroke="#000" strokeWidth="2" />
                </g>

                {/* 4. MID-GROUND TEAL BUILDINGS */}
                <g fill="#2d4a54">
                  <rect x="0" y="280" width="75" height="100" />
                  <rect x="70" y="295" width="85" height="85" />
                  <rect x="150" y="275" width="95" height="105" />
                  <rect x="240" y="290" width="80" height="90" />
                  <rect x="315" y="270" width="45" height="110" />

                  {/* Antenna masts */}
                  <line x1="45" y1="250" x2="45" y2="280" stroke="#1a2d33" strokeWidth="2" />
                  <line x1="175" y1="240" x2="175" y2="275" stroke="#1a2d33" strokeWidth="2" />
                  <line x1="171" y1="250" x2="179" y2="250" stroke="#1a2d33" strokeWidth="2" />

                  {/* Glowing Pixel Windows */}
                  <g fill="#fef08a">
                    <rect x="15" y="295" width="8" height="10" />
                    <rect x="35" y="295" width="8" height="10" />
                    <rect x="15" y="320" width="8" height="10" />
                    <rect x="95" y="315" width="10" height="12" />
                    <rect x="115" y="315" width="10" height="12" />
                    <rect x="175" y="290" width="9" height="11" />
                    <rect x="205" y="290" width="9" height="11" />
                    <rect x="175" y="315" width="9" height="11" />
                    <rect x="270" y="305" width="9" height="12" />
                    <rect x="330" y="290" width="8" height="10" />
                  </g>
                </g>

                {/* Dither Texture on Rooftops */}
                <rect x="0" y="340" width="360" height="30" fill="url(#pixelDither)" opacity="0.3" />

                {/* 5. INTERIOR ARCHITECTURE & SHELVING */}
                
                {/* Frame & Mullions */}
                <rect x="0" y="0" width="14" height="600" fill="#1e1814" />
                <rect x="346" y="0" width="14" height="600" fill="#1e1814" />
                <rect x="0" y="0" width="360" height="16" fill="#1e1814" />
                <rect x="118" y="16" width="6" height="350" fill="#2d2119" stroke="#000" strokeWidth="1" />
                <rect x="236" y="16" width="6" height="350" fill="#2d2119" stroke="#000" strokeWidth="1" />

                {/* SHELF 1: TOP HANGING SHELF (Y = 192) */}
                <g>
                  <rect x="40" y="196" width="6" height="12" fill="#000" />
                  <rect x="160" y="196" width="6" height="12" fill="#000" />
                  <rect x="280" y="196" width="6" height="12" fill="#000" />
                  <rect x="14" y="192" width="332" height="7" fill="#5c381e" stroke="#000" strokeWidth="1" />
                  <rect x="14" y="192" width="332" height="2" fill="#8b572a" />
                </g>

                {/* SHELF 2: WIDE WINDOW SILL / LEDGE (Y = 366) */}
                <g>
                  <rect x="0" y="366" width="360" height="14" fill="#4a2e18" stroke="#000" strokeWidth="2" />
                  <rect x="0" y="366" width="360" height="3" fill="#7a4f2b" />
                  <rect x="30" y="380" width="18" height="14" fill="#362111" stroke="#000" strokeWidth="1" />
                  <rect x="150" y="380" width="18" height="14" fill="#362111" stroke="#000" strokeWidth="1" />
                  <rect x="270" y="380" width="18" height="14" fill="#362111" stroke="#000" strokeWidth="1" />
                </g>

                {/* Lower Interior Brick Wall */}
                <rect x="0" y="380" width="360" height="155" fill="#2d2621" />
                <g stroke="#1b1714" strokeWidth="2" opacity="0.5">
                  <line x1="0" y1="410" x2="360" y2="410" />
                  <line x1="0" y1="440" x2="360" y2="440" />
                  <line x1="0" y1="470" x2="360" y2="470" />
                  <line x1="0" y1="500" x2="360" y2="500" />
                  <line x1="0" y1="530" x2="360" y2="530" />
                </g>

                {/* SHELF 3: TERRACOTTA TILED FLOOR (Y = 550) */}
                <g>
                  <polygon points="0,535 360,535 360,600 0,600" fill="#783516" stroke="#000" strokeWidth="2" />
                  <line x1="0" y1="565" x2="360" y2="565" stroke="#4d1e08" strokeWidth="2" />
                  <line x1="70" y1="535" x2="50" y2="600" stroke="#4d1e08" strokeWidth="2" />
                  <line x1="160" y1="535" x2="150" y2="600" stroke="#4d1e08" strokeWidth="2" />
                  <line x1="250" y1="535" x2="260" y2="600" stroke="#4d1e08" strokeWidth="2" />
                </g>

                {/* 6. PLANTS & EMPTY SAUCERS PINNED EXACTLY TO SURFACES */}
                {SCENE_SPOTS.map((spot, i) => {
                  const sp = sunroomData[i];
                  return (
                    <g key={i}>
                      {sp ? (
                        <g className="cursor-pointer" onClick={() => setInspectedPlant(sp)}>
                          {/* Ground Contact Shadow */}
                          <ellipse cx={spot.x} cy={spot.y + 1} rx={28 * spot.scale} ry={5 * spot.scale} fill="#000" opacity="0.35" />
                          
                          {/* Plant Rendered Flush to Surface */}
                          <g transform={`translate(${spot.x}, ${spot.y}) scale(${spot.scale}) translate(-100, -214)`}>
                            <PlantGraphic plant={sp} isBlooming={true} />
                          </g>

                          {/* Mounted Brass Plaque */}
                          <g transform={`translate(${spot.x - 22 * spot.scale}, ${spot.plateY})`}>
                            <rect width={44 * spot.scale} height={9 * spot.scale} fill="#ca8a04" stroke="#000" strokeWidth="1" />
                            <text x={22 * spot.scale} y={6.5 * spot.scale} fontSize={5 * spot.scale} fill="#000" textAnchor="middle" fontWeight="bold">
                              {sp.slotName.substring(0, 7)}
                            </text>
                          </g>
                        </g>
                      ) : (
                        /* Empty Brass Saucer on Shelf */
                        <g transform={`translate(${spot.x}, ${spot.y})`}>
                          <ellipse cx="0" cy="0" rx={24 * spot.scale} ry={5 * spot.scale} fill="#ca8a04" opacity="0.4" stroke="#000" strokeWidth="1" />
                          <ellipse cx="0" cy="-1" rx={20 * spot.scale} ry={4 * spot.scale} fill="#a16207" opacity="0.4" />
                          <text x="0" y={-8 * spot.scale} fontSize={6 * spot.scale} fill="#ca8a04" opacity="0.7" textAnchor="middle">
                            +
                          </text>
                        </g>
                      )}
                    </g>
                  );
                })}
              </svg>

              {/* Plant Inspection Modal */}
              {inspectedPlant && (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={() => setInspectedPlant(null)}>
                  <div className="w-full max-w-xs retro-panel border-amber-500 p-4 text-center" onClick={(e) => e.stopPropagation()}>
                    <div className="w-20 h-20 mx-auto mb-2">
                      <PlantVisual plant={inspectedPlant} isBlooming={true} />
                    </div>
                    <h3 className="text-sm font-bold text-slate-900 dark:text-white uppercase mb-1">{inspectedPlant.slotName}</h3>
                    <p className="text-[9px] text-emerald-600 dark:text-retro-neonGreen font-bold mb-2">{getArch(inspectedPlant.type).name}</p>
                    <div className="bg-slate-100 dark:bg-black border-2 border-slate-600 p-2 text-left text-[8px] space-y-1 mb-3">
                      <p><span className="text-slate-500">RETIRED ON:</span> <span className="font-bold">DAY {Math.floor(inspectedPlant.age)}</span></p>
                      <p><span className="text-slate-500">FINAL HEALTH:</span> <span className="font-bold text-emerald-500">{inspectedPlant.health}% HP</span></p>
                      <p className="text-slate-400 italic pt-1">{getArch(inspectedPlant.type).tagline}</p>
                    </div>
                    <button onClick={() => setInspectedPlant(null)} className="retro-btn w-full py-2 bg-emerald-500 text-black text-[8px] font-bold">
                      CLOSE
                    </button>
                  </div>
                </div>
              )}

            </div>
          )}

          {/* ======================= MODAL: TUTORIAL ======================= */}
          {tutorialOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel border-amber-500 dark:border-retro-yellow p-4 flex flex-col max-h-[90vh]">
                <div className="text-center pb-2 mb-2 border-b-2 border-slate-400 dark:border-retro-border">
                  <span className="text-[10px] text-amber-600 dark:text-retro-yellow font-bold">FIELD MANUAL</span>
                </div>
                <div className="overflow-y-auto space-y-3 text-[8px] pr-1 leading-relaxed text-slate-800 dark:text-slate-200">
                  <div><span className="text-emerald-600 dark:text-retro-neonGreen font-bold">1. STATUS METERS:</span><p className="text-slate-600 dark:text-retro-border mt-0.5">Keep all meters in the GREEN range. Meters decay naturally over time.</p></div>
                  <div><span className="text-emerald-600 dark:text-retro-neonGreen font-bold">2. CARE ACTIONS:</span><p className="text-slate-600 dark:text-retro-border mt-0.5"><span className="text-black dark:text-white font-bold">WATER:</span> +Moisture</p><p className="text-slate-600 dark:text-retro-border"><span className="text-black dark:text-white font-bold">FEED:</span> +Dirt nutrients</p><p className="text-slate-600 dark:text-retro-border"><span className="text-black dark:text-white font-bold">SPRAY:</span> Clears bug swarms</p><p className="text-slate-600 dark:text-retro-border"><span className="text-black dark:text-white font-bold">PRUNE:</span> Trims leaves for +HP</p></div>
                  <div><span className="text-emerald-600 dark:text-retro-neonGreen font-bold">3. CLIMATE DIALS:</span><p className="text-slate-600 dark:text-retro-border mt-0.5">Use <span className="text-black dark:text-white font-bold">SUN (+/-)</span> and <span className="text-black dark:text-white font-bold">TMP (+/-)</span> buttons to balance the room environment.</p></div>
                  <div><span className="text-emerald-600 dark:text-retro-neonGreen font-bold">4. MYSTERY SEEDS:</span><p className="text-slate-600 dark:text-retro-border mt-0.5">Every plant begins unknown. Once it reaches maturity, its true species and exact ideal ranges are revealed!</p></div>
                  <div><span className="text-emerald-600 dark:text-retro-neonGreen font-bold">5. SUNROOM RETIREMENT:</span><p className="text-slate-600 dark:text-retro-border mt-0.5">Keep HP above 0. If your plant survives to Day 20, you can retire it to your permanent Sunroom collection!</p></div>
                </div>
                <button onClick={() => setTutorialOpen(false)} className="retro-btn w-full py-2.5 bg-emerald-500 dark:bg-retro-neonGreen text-black text-[8px] mt-4 font-bold">DISMISS</button>
              </div>
            </div>
          )}

          {/* ======================= MODAL: RENAME ======================= */}
          {nameModal.open && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel p-4">
                <h3 className="text-[10px] text-slate-900 dark:text-white mb-2 font-bold">{nameModal.isNew ? ('NEW FILE (SLOT ' + (nameModal.slotIndex + 1) + ')') : 'RENAME FILE'}</h3>
                <p className="text-[8px] text-slate-600 dark:text-retro-border mb-4 leading-relaxed">ENTER DESIGNATION CODE:</p>
                <form onSubmit={(e) => { e.preventDefault(); handleSaveName(e.target.elements.slotInput.value); }}>
                  <input name="slotInput" defaultValue={nameModal.currentName} autoFocus maxLength={12} className="w-full px-2 py-2 text-[10px] bg-slate-100 dark:bg-black border-2 border-slate-600 dark:border-retro-border text-emerald-700 dark:text-retro-neonGreen focus:outline-none focus:border-black dark:focus:border-white mb-4 uppercase font-bold" />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false })} className="retro-btn flex-1 py-2 text-[8px] bg-slate-200 dark:bg-black text-black dark:text-white font-bold">CANCEL</button>
                    <button type="submit" className="retro-btn flex-1 py-2 text-[8px] bg-emerald-500 dark:bg-retro-neonGreen text-black font-bold">ACCEPT</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================= MODAL: DISCOVERY ======================= */}
          {revealModal.open && revealModal.plantType && getArch(revealModal.plantType) && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel border-emerald-500 dark:border-retro-neonGreen p-5 text-center">
                <div className="mb-4 animate-pulse"><span className="text-[10px] text-black bg-emerald-400 dark:bg-retro-neonGreen px-2 py-1 font-bold">SPECIES IDENTIFIED!</span></div>
                <h2 className="text-sm text-slate-900 dark:text-white mb-2 font-bold">{getArch(revealModal.plantType).name}</h2>
                <p className="text-[8px] text-slate-600 dark:text-retro-border mb-4 leading-loose">{getArch(revealModal.plantType).tagline}</p>
                <div className="bg-slate-100 dark:bg-black border-2 border-slate-600 dark:border-retro-border p-3 text-left text-[8px] space-y-2 mb-6">
                  <div className="flex justify-between font-bold"><span className="text-slate-600 dark:text-retro-border">IDEAL H2O:</span><span className="text-blue-600 dark:text-retro-blue">{getArch(revealModal.plantType).moisture[0]}-{getArch(revealModal.plantType).moisture[1]}%</span></div>
                  <div className="flex justify-between font-bold"><span className="text-slate-600 dark:text-retro-border">IDEAL SUN:</span><span className="text-amber-600 dark:text-retro-yellow">{getArch(revealModal.plantType).sunlight[0]}-{getArch(revealModal.plantType).sunlight[1]}%</span></div>
                </div>
                <button onClick={() => setRevealModal({ open: false, plantType: null })} className="retro-btn w-full py-3 bg-emerald-500 dark:bg-retro-neonGreen text-black text-[8px] font-bold">CONTINUE</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
