<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tiny Plant Sim 1.0</title>
  
  <!-- 90s Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Press Start 2P"', 'monospace']
          },
          colors: {
            retro: {
              bg: '#111827',
              panel: '#1f2937',
              green: '#16a34a',
              neonGreen: '#39ff14',
              red: '#ff003c',
              yellow: '#ffea00',
              blue: '#00f0ff',
              border: '#94a3b8'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* CRT Scanline Filter */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 4px, 3px 100%;
      z-index: 100;
      pointer-events: none;
    }
    
    /* Retro UI Panels & Buttons */
    .retro-panel {
      background-color: #ffffff;
      border: 3px solid #334155;
      box-shadow: 4px 4px 0px 0px #000;
    }
    .dark .retro-panel {
      background-color: #1f2937;
      border-color: #94a3b8;
    }

    .retro-btn {
      border: 2px solid #000;
      box-shadow: 3px 3px 0px 0px #000;
      transition: all 0.05s ease;
    }
    .dark .retro-btn {
      border-color: #fff;
    }
    .retro-btn:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px 0px #000;
    }
    .retro-btn:disabled {
      opacity: 0.5;
      box-shadow: 1px 1px 0px 0px #000;
      transform: translate(2px, 2px);
    }
    
    /* Crisp 8-Bit Rendering */
    svg.pixelated {
      shape-rendering: crispEdges;
    }

    /* 2-Frame Retro Looping Idle Animations */
    @keyframes retroBop {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
    .plant-idle-anim {
      animation: retroBop 1.2s steps(2, start) infinite;
      transform-origin: bottom center;
    }

    @keyframes bugTwitch {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(1px, -1px);
      }
    }
    .bug-idle-anim {
      animation: bugTwitch 0.4s steps(2, start) infinite;
    }

    @keyframes flowerPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }
    .flower-anim {
      animation: flowerPulse 0.8s steps(2, start) infinite;
      transform-origin: center;
    }
  </style>
</head>
<body class="bg-slate-200 dark:bg-black text-slate-900 dark:text-white transition-colors duration-150">
  <div class="crt-overlay"></div>
  <div id="root" class="h-full relative z-10 bg-slate-200 dark:bg-retro-bg transition-colors duration-150"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PLANT_ARCHETYPES = {
      cactus: {
        name: 'DESERT CACTUS',
        tagline: 'LOVES INTENSE SUN & LITTLE WATER.',
        moisture: [10, 35], sunlight: [65, 95], temp: [72, 95], soil: [25, 65],
        color: '#16a34a', leafColor: '#15803d'
      },
      succulent: {
        name: 'FLESHY SUCC',
        tagline: 'THRIVES IN WARMTH & DRY SOIL.',
        moisture: [20, 45], sunlight: [55, 85], temp: [65, 88], soil: [40, 75],
        color: '#0d9488', leafColor: '#0f766e'
      },
      fern: {
        name: 'CANOPY FERN',
        tagline: 'CRAVES MOISTURE & GENTLE SHADE.',
        moisture: [60, 90], sunlight: [25, 55], temp: [60, 76], soil: [60, 95],
        color: '#22c55e', leafColor: '#16a34a'
      },
      leafy: {
        name: 'BROAD AROID',
        tagline: 'BALANCED LIGHT & STEADY WARMTH.',
        moisture: [45, 75], sunlight: [40, 75], temp: [65, 82], soil: [50, 90],
        color: '#4ade80', leafColor: '#22c55e'
      },
      bonsai: {
        name: 'PINE BONSAI',
        tagline: 'ANCIENT TREE CRAVING STRICT CARE.',
        moisture: [35, 60], sunlight: [45, 75], temp: [60, 80], soil: [60, 95],
        color: '#78350f', leafColor: '#065f46'
      },
      flytrap: {
        name: 'SNAP TRAP',
        tagline: 'CARNIVOROUS SPROUT. WARM & DAMP.',
        moisture: [65, 95], sunlight: [50, 80], temp: [70, 90], soil: [20, 55],
        color: '#dc2626', leafColor: '#16a34a'
      },
      orchid: {
        name: 'MOTH ORCHID',
        tagline: 'TROPICAL BEAUTY. HUMID AIR.',
        moisture: [50, 80], sunlight: [30, 60], temp: [68, 84], soil: [40, 75],
        color: '#d946ef', leafColor: '#84cc16'
      },
      snake: {
        name: 'VIPER BLADE',
        tagline: 'TOUGH AS NAILS. HARD TO KILL.',
        moisture: [10, 40], sunlight: [20, 85], temp: [55, 90], soil: [20, 80],
        color: '#eab308', leafColor: '#15803d'
      },
      bamboo: {
        name: 'LUCKY BAMBOO',
        tagline: 'HAPPY IN PURE WATER & SHADE.',
        moisture: [60, 95], sunlight: [25, 60], temp: [65, 85], soil: [35, 80],
        color: '#84cc16', leafColor: '#4d7c0f'
      },
      sunflower: {
        name: 'SUN CHASER',
        tagline: 'WORSHIPS THE BLAZING SUN.',
        moisture: [40, 70], sunlight: [75, 100], temp: [70, 92], soil: [50, 90],
        color: '#ca8a04', leafColor: '#22c55e'
      }
    };

    function getArch(type) {
      return PLANT_ARCHETYPES[type] || PLANT_ARCHETYPES['leafy'];
    }

    function safeLoadSlot(slotIdx) {
      try {
        const raw = localStorage.getItem('plant_slot_' + slotIdx);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.conditions && parsed.ideals) {
          if (!PLANT_ARCHETYPES[parsed.type]) {
            parsed.type = 'leafy';
          }
          return parsed;
        }
        return null;
      } catch (err) {
        return null;
      }
    }

    function generateNewPlant(slotNum, customName) {
      const types = ['cactus', 'succulent', 'fern', 'leafy', 'bonsai', 'flytrap', 'orchid', 'snake', 'bamboo', 'sunflower'];
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const archetype = getArch(chosenType);
      const randomReveal = Math.floor(Math.random() * (12 - 6 + 1)) + 6;

      return {
        id: Date.now(),
        slotName: customName || ('SLOT ' + (slotNum + 1)),
        type: chosenType,
        revealed: false,
        revealAge: randomReveal,
        age: 1.0,
        health: 100,
        isDead: false,
        potColor: ['#ea580c', '#d97706', '#059669', '#475569', '#7c3aed', '#0284c7'][slotNum % 6],
        conditions: { moisture: 50, sunlight: 50, temperature: 72, soilHealth: 85, infestation: 0 },
        ideals: {
          moisture: [archetype.moisture[0], archetype.moisture[1]],
          sunlight: [archetype.sunlight[0], archetype.sunlight[1]],
          temp: [archetype.temp[0], archetype.temp[1]],
          soil: [archetype.soil[0], archetype.soil[1]]
        }
      };
    }

    // Blocky Icons
    const DropletIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L12 2 L16 10 L18 14 L18 18 L16 22 L8 22 L6 18 L6 14 L8 10 Z"/></svg>
    );
    const SunIcon = () => (
      <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8"/><rect x="11" y="2" width="2" height="4"/><rect x="11" y="18" width="2" height="4"/><rect x="2" y="11" width="4" height="2"/><rect x="18" y="11" width="4" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="18" y="18" width="2" height="2"/><rect x="4" y="18" width="2" height="2"/><rect x="18" y="4" width="2" height="2"/></svg>
    );
    const MoonIcon = () => (
      <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="2" width="6" height="2"/><rect x="6" y="4" width="4" height="4"/><rect x="4" y="8" width="4" height="8"/><rect x="6" y="16" width="4" height="4"/><rect x="10" y="20" width="6" height="2"/><rect x="14" y="16" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><rect x="14" y="4" width="4" height="4"/></svg>
    );
    const ThermometerIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="2" width="4" height="14"/><rect x="8" y="14" width="8" height="8"/></svg>
    );
    const BugIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="6" width="8" height="12"/><rect x="4" y="8" width="4" height="2"/><rect x="16" y="8" width="4" height="2"/><rect x="4" y="14" width="4" height="2"/><rect x="16" y="14" width="4" height="2"/><rect x="10" y="2" width="1" height="4"/><rect x="13" y="2" width="1" height="4"/></svg>
    );
    const ShovelIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="14,2 22,2 22,10 12,20 4,20 4,12"/><rect x="4" y="14" width="6" height="6" fill="#111827"/></svg>
    );
    const SprayIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="14"/><rect x="10" y="4" width="4" height="4"/><rect x="4" y="4" width="6" height="2"/><rect x="2" y="4" width="2" height="6"/></svg>
    );
    const ScissorsIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><polygon points="10,10 20,2 20,6 12,12"/><polygon points="10,14 20,22 20,18 12,12"/><rect x="6" y="6" width="2" height="2" fill="#111827"/><rect x="6" y="16" width="2" height="2" fill="#111827"/></svg>
    );
    const PencilIcon = () => (
      <svg className="w-3.5 h-3.5 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="16,2 22,8 8,22 2,22 2,16"/></svg>
    );
    const ArrowLeftIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="10,4 2,12 10,20 10,14 22,14 22,10 10,10"/></svg>
    );
    const TrashIcon = () => (
      <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="16"/><rect x="4" y="4" width="16" height="2"/><rect x="10" y="2" width="4" height="2"/></svg>
    );

    function App() {
      const [screen, setScreen] = useState('home');
      const [activeSlot, setActiveSlot] = useState(0);
      const [slotsData, setSlotsData] = useState(() => [safeLoadSlot(0), safeLoadSlot(1), safeLoadSlot(2)]);
      const [plant, setPlant] = useState(null);
      const [toast, setToast] = useState('');
      const [nameModal, setNameModal] = useState({ open: false, slotIndex: 0, currentName: '', isNew: false });
      const [revealModal, setRevealModal] = useState({ open: false, plantType: null });
      const [tutorialOpen, setTutorialOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(() => {
        try {
          return localStorage.getItem('plant_dark_mode') !== 'false';
        } catch (e) {
          return true;
        }
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        try {
          localStorage.setItem('plant_dark_mode', darkMode);
        } catch (e) {}
      }, [darkMode]);

      useEffect(() => {
        if (!plant) return;
        try {
          localStorage.setItem('plant_slot_' + activeSlot, JSON.stringify(plant));
        } catch (e) {}
        setSlotsData(prev => {
          const next = [prev[0], prev[1], prev[2]];
          next[activeSlot] = plant;
          return next;
        });
      }, [plant, activeSlot]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2000);
      };

      // Game Loop
      useEffect(() => {
        if (screen !== 'game' || !plant || plant.isDead || revealModal.open || tutorialOpen) return;

        const interval = setInterval(() => {
          setPlant(prev => {
            if (!prev || prev.isDead) return prev;

            let moisture = prev.conditions.moisture;
            let sunlight = prev.conditions.sunlight;
            let temperature = prev.conditions.temperature;
            let soilHealth = prev.conditions.soilHealth;
            let infestation = prev.conditions.infestation;
            let healthDelta = 0;

            const moistureDrain = 1.0 + (temperature > 80 ? 0.8 : 0) + (sunlight > 75 ? 0.6 : 0);
            moisture = Math.max(0, Math.min(100, moisture - moistureDrain));
            soilHealth = Math.max(0, Math.min(100, soilHealth - 0.25));

            if (soilHealth < 40 || moisture > 85) {
              if (Math.random() < 0.35) infestation = Math.min(100, infestation + 4);
            }

            const mMin = prev.ideals.moisture[0];
            const mMax = prev.ideals.moisture[1];
            const sMin = prev.ideals.sunlight[0];
            const sMax = prev.ideals.sunlight[1];
            const tMin = prev.ideals.temp[0];
            const tMax = prev.ideals.temp[1];
            const soilMin = prev.ideals.soil[0];

            if (moisture < mMin) healthDelta -= (mMin - moisture) * 0.15;
            else if (moisture > mMax) healthDelta -= (moisture - mMax) * 0.15;
            else healthDelta += 0.5;

            if (sunlight < sMin) healthDelta -= (sMin - sunlight) * 0.12;
            else if (sunlight > sMax) healthDelta -= (sunlight - sMax) * 0.12;
            else healthDelta += 0.4;

            if (temperature < tMin) healthDelta -= (tMin - temperature) * 0.18;
            else if (temperature > tMax) healthDelta -= (temperature - tMax) * 0.18;

            if (soilHealth < soilMin) healthDelta -= 1.2;
            if (infestation > 15) healthDelta -= (infestation - 15) * 0.22;

            const newHealth = Math.max(0, Math.min(100, prev.health + healthDelta));
            const isDead = newHealth <= 0;

            let newAge = prev.age;
            let newlyRevealed = false;
            let newRevealedState = prev.revealed;

            if (!isDead && newHealth > 40) {
              newAge = +(prev.age + 0.15).toFixed(2);
              if (!prev.revealed && newAge >= prev.revealAge) {
                newRevealedState = true;
                newlyRevealed = true;
              }
            }

            if (newlyRevealed) {
              setRevealModal({ open: true, plantType: prev.type });
            }

            return {
              id: prev.id,
              slotName: prev.slotName,
              type: prev.type,
              potColor: prev.potColor,
              revealAge: prev.revealAge,
              ideals: prev.ideals,
              age: newAge,
              health: Math.round(newHealth),
              revealed: newRevealedState,
              isDead: isDead,
              conditions: {
                moisture: Math.round(moisture),
                sunlight: sunlight,
                temperature: temperature,
                soilHealth: Math.round(soilHealth),
                infestation: Math.round(infestation)
              }
            };
          });
        }, 3000);

        return () => clearInterval(interval);
      }, [screen, plant ? plant.isDead : false, revealModal.open, tutorialOpen]);

      const applyCare = (action) => {
        if (!plant || plant.isDead) return;

        setPlant(prev => {
          let c = {
            moisture: prev.conditions.moisture,
            sunlight: prev.conditions.sunlight,
            temperature: prev.conditions.temperature,
            soilHealth: prev.conditions.soilHealth,
            infestation: prev.conditions.infestation
          };
          let h = prev.health;

          switch (action) {
            case 'water':
              c.moisture = Math.min(100, c.moisture + 22);
              if (c.infestation > 0) c.infestation = Math.max(0, c.infestation - 4);
              showToast('+H2O');
              break;
            case 'fertilize':
              c.soilHealth = Math.min(100, c.soilHealth + 26);
              showToast('+SOIL');
              break;
            case 'sun_up':
              c.sunlight = Math.min(100, c.sunlight + 15);
              showToast('+SUN');
              break;
            case 'sun_down':
              c.sunlight = Math.max(0, c.sunlight - 15);
              showToast('-SUN');
              break;
            case 'temp_up':
              c.temperature = Math.min(105, c.temperature + 4);
              showToast('+HEAT');
              break;
            case 'temp_down':
              c.temperature = Math.max(40, c.temperature - 4);
              showToast('-HEAT');
              break;
            case 'spray':
              c.infestation = Math.max(0, c.infestation - 45);
              c.soilHealth = Math.max(0, c.soilHealth - 6);
              showToast('PESTS CLR');
              break;
            case 'prune':
              h = Math.min(100, h + 8);
              showToast('+HP');
              break;
          }

          return {
            ...prev,
            health: h,
            conditions: c
          };
        });
      };

      const startNewGamePrompt = (slotIdx) => {
        setNameModal({ open: true, slotIndex: slotIdx, currentName: ('SLOT ' + (slotIdx + 1)), isNew: true });
      };

      const editSlotNamePrompt = (slotIdx) => {
        const current = (slotsData[slotIdx] && slotsData[slotIdx].slotName) ? slotsData[slotIdx].slotName : ('SLOT ' + (slotIdx + 1));
        setNameModal({ open: true, slotIndex: slotIdx, currentName: current, isNew: false });
      };

      const handleSaveName = (enteredName) => {
        const finalName = enteredName.trim().toUpperCase() || ('SLOT ' + (nameModal.slotIndex + 1));
        if (nameModal.isNew) {
          const fresh = generateNewPlant(nameModal.slotIndex, finalName);
          setPlant(fresh);
          setActiveSlot(nameModal.slotIndex);
          try {
            localStorage.setItem('plant_slot_' + nameModal.slotIndex, JSON.stringify(fresh));
          } catch (e) {}
          setSlotsData(prev => {
            const next = [prev[0], prev[1], prev[2]];
            next[nameModal.slotIndex] = fresh;
            return next;
          });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false });
          setScreen('game');
        } else {
          if (plant && activeSlot === nameModal.slotIndex) {
            setPlant(prev => ({ ...prev, slotName: finalName }));
          }
          setSlotsData(prev => {
            const next = [prev[0], prev[1], prev[2]];
            if (next[nameModal.slotIndex]) {
              next[nameModal.slotIndex] = { ...next[nameModal.slotIndex], slotName: finalName };
              try {
                localStorage.setItem('plant_slot_' + nameModal.slotIndex, JSON.stringify(next[nameModal.slotIndex]));
              } catch (e) {}
            }
            return next;
          });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false });
        }
      };

      const deleteSlot = (slotIdx, e) => {
        e.stopPropagation();
        if (confirm('ERASE SLOT ' + (slotIdx + 1) + '?')) {
          try {
            localStorage.removeItem('plant_slot_' + slotIdx);
          } catch (err) {}
          setSlotsData(prev => {
            const next = [prev[0], prev[1], prev[2]];
            next[slotIdx] = null;
            return next;
          });
          if (activeSlot === slotIdx) setPlant(null);
        }
      };

      const selectSlotToPlay = (slotIdx) => {
        setActiveSlot(slotIdx);
        setPlant(slotsData[slotIdx]);
        setScreen('game');
      };

      const getBarColor = (val, min, max, isPest) => {
        if (isPest) {
          if (val <= 15) return 'bg-retro-green dark:bg-retro-neonGreen';
          if (val <= 40) return 'bg-amber-500 dark:bg-retro-yellow';
          return 'bg-retro-red';
        }
        if (val >= min && val <= max) return 'bg-retro-green dark:bg-retro-neonGreen';
        const dist = Math.min(Math.abs(val - min), Math.abs(val - max));
        if (dist <= 12) return 'bg-amber-500 dark:bg-retro-yellow';
        return 'bg-retro-red';
      };

      const getVisualPlantColors = () => {
        if (!plant) return { body: '#16a34a', leaf: '#22c55e', stroke: '#000' };
        if (plant.isDead) return { body: '#64748b', leaf: '#475569', stroke: '#000' };
        if (plant.health < 35 && plant.conditions.moisture < plant.ideals.moisture[0]) {
          return { body: '#d97706', leaf: '#f59e0b', stroke: '#000' };
        }
        if (plant.health < 35 && plant.conditions.moisture > plant.ideals.moisture[1]) {
          return { body: '#064e3b', leaf: '#047857', stroke: '#000' };
        }
        const arch = getArch(plant.type);
        return { body: arch.color, leaf: arch.leafColor, stroke: '#000' };
      };

      const colors = getVisualPlantColors();
      const growthProgress = plant ? Math.min(plant.age / 18, 1) : 0.5;
      const plantHeight = 24 + growthProgress * 70;
      const soilBaseY = 168;
      const stemTopY = soilBaseY - plantHeight;
      const isBlooming = plant && !plant.isDead && plant.age >= 6 && plant.health >= 55;

      return (
        <div className="h-full w-full max-w-md mx-auto flex flex-col justify-between overflow-hidden p-3 box-border">
          
          {/* ======================= SCREEN 1: TITLE / HOME ======================= */}
          {screen === 'home' && (
            <div className="h-full flex flex-col justify-between py-2">
              <div className="flex justify-between items-center px-1 py-1">
                <span className="text-[10px] text-emerald-700 dark:text-retro-neonGreen font-bold">POCKET GARDEN</span>
                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => setTutorialOpen(true)}

                      <span>{plant.conditions.moisture}%</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-black border-2 border-slate-600 dark:border-retro-border h-3">
                      <div className={'h-full ' + getBarColor(plant.conditions.moisture, plant.ideals.moisture[0], plant.ideals.moisture[1], false)} style={{ width: plant.conditions.moisture + '%' }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><SunIcon /> SUN</span>
                      <span>{plant.conditions.sunlight}%</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-black border-2 border-slate-600 dark:border-retro-border h-3">
                      <div className={'h-full ' + getBarColor(plant.conditions.sunlight, plant.ideals.sunlight[0], plant.ideals.sunlight[1], false)} style={{ width: plant.conditions.sunlight + '%' }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><ThermometerIcon /> TMP</span>
                      <span>{plant.conditions.temperature}°</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-black border-2 border-slate-600 dark:border-retro-border h-3">
                      <div className={'h-full ' + getBarColor(plant.conditions.temperature, plant.ideals.temp[0], plant.ideals.temp[1], false)} style={{ width: Math.min(100, Math.max(0, (plant.conditions.temperature - 40) * 1.5)) + '%' }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><ShovelIcon /> DIRT</span>
                      <span>{plant.conditions.soilHealth}%</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-black border-2 border-slate-600 dark:border-retro-border h-3">
                      <div className={'h-full ' + getBarColor(plant.conditions.soilHealth, plant.ideals.soil[0], 100, false)} style={{ width: plant.conditions.soilHealth + '%' }} />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-[8px] mb-1">
                      <span className="flex items-center gap-1"><BugIcon /> BUG</span>
                      <span>{plant.conditions.infestation}%</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-black border-2 border-slate-600 dark:border-retro-border h-3">
                      <div className={'h-full ' + getBarColor(plant.conditions.infestation, 0, 15, true)} style={{ width: plant.conditions.infestation + '%' }} />
                    </div>
                  </div>
                </div>
              </div>

              {/* BOTTOM SECTION: Buttons & Controls */}
              <div className="shrink-0 space-y-2 pb-1">
                
                {/* Toast Notification */}
                <div className="h-6 flex items-center justify-center">
                  {toast && (
                    <span className="text-[8px] text-black bg-emerald-400 dark:bg-retro-neonGreen px-2 py-1 border-2 border-black dark:border-white shadow-[2px_2px_0_0_#000] font-bold">
                      {toast}
                    </span>
                  )}
                </div>

                {/* Main Actions */}
                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => applyCare('water')} disabled={plant.isDead} className="retro-btn bg-blue-600 text-white py-2 flex flex-col items-center">
                    <DropletIcon />
                    <span className="text-[7px] mt-2">WATER</span>
                  </button>
                  <button onClick={() => applyCare('fertilize')} disabled={plant.isDead} className="retro-btn bg-amber-600 text-white py-2 flex flex-col items-center">
                    <ShovelIcon />
                    <span className="text-[7px] mt-2">FEED</span>
                  </button>
                  <button onClick={() => applyCare('spray')} disabled={plant.isDead} className="retro-btn bg-rose-600 text-white py-2 flex flex-col items-center">
                    <SprayIcon />
                    <span className="text-[7px] mt-2">SPRAY</span>
                  </button>
                  <button onClick={() => applyCare('prune')} disabled={plant.isDead} className="retro-btn bg-emerald-600 text-white py-2 flex flex-col items-center">
                    <ScissorsIcon />
                    <span className="text-[7px] mt-2">PRUNE</span>
                  </button>
                </div>

                {/* Environmental Controls */}
                <div className="grid grid-cols-2 gap-2">
                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1"><SunIcon /> SUN</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('sun_down')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">-</button>
                      <button onClick={() => applyCare('sun_up')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">+</button>
                    </div>
                  </div>

                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1"><ThermometerIcon /> TMP</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('temp_down')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">-</button>
                      <button onClick={() => applyCare('temp_up')} disabled={plant.isDead} className="retro-btn bg-slate-200 dark:bg-black text-black dark:text-white w-6 h-6 flex items-center justify-center text-[10px] font-bold">+</button>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          )}

          {/* ======================= MODAL: TUTORIAL / HOW TO PLAY ======================= */}
          {tutorialOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel border-amber-500 dark:border-retro-yellow p-4 flex flex-col max-h-[90vh]">
                <div className="text-center pb-2 mb-2 border-b-2 border-slate-400 dark:border-retro-border">
                  <span className="text-[10px] text-amber-600 dark:text-retro-yellow font-bold">FIELD MANUAL</span>
                </div>
                
                <div className="overflow-y-auto space-y-3 text-[8px] pr-1 leading-relaxed text-slate-800 dark:text-slate-200">
                  <div>
                    <span className="text-emerald-600 dark:text-retro-neonGreen font-bold">1. STATUS METERS:</span>
                    <p className="text-slate-600 dark:text-retro-border mt-0.5">Keep all meters in the GREEN range. Meters decay naturally over time.</p>
                  </div>

                  <div>
                    <span className="text-emerald-600 dark:text-retro-neonGreen font-bold">2. CARE ACTIONS:</span>
                    <p className="text-slate-600 dark:text-retro-border mt-0.5"><span className="text-black dark:text-white font-bold">WATER:</span> +Moisture</p>
                    <p className="text-slate-600 dark:text-retro-border"><span className="text-black dark:text-white font-bold">FEED:</span> +Dirt nutrients</p>
                    <p className="text-slate-600 dark:text-retro-border"><span className="text-black dark:text-white font-bold">SPRAY:</span> Clears bug swarms</p>
                    <p className="text-slate-600 dark:text-retro-border"><span className="text-black dark:text-white font-bold">PRUNE:</span> Trims leaves for +HP</p>
                  </div>

                  <div>
                    <span className="text-emerald-600 dark:text-retro-neonGreen font-bold">3. CLIMATE DIALS:</span>
                    <p className="text-slate-600 dark:text-retro-border mt-0.5">Use <span className="text-black dark:text-white font-bold">SUN (+/-)</span> and <span className="text-black dark:text-white font-bold">TMP (+/-)</span> buttons to balance the room environment.</p>
                  </div>

                  <div>
                    <span className="text-emerald-600 dark:text-retro-neonGreen font-bold">4. 10 SPECIES TO DISCOVER:</span>
                    <p className="text-slate-600 dark:text-retro-border mt-0.5">Every plant begins as an unknown seedling. Once mature, its true species and exact ideal climate are revealed!</p>
                  </div>

                  <div>
                    <span className="text-emerald-600 dark:text-retro-neonGreen font-bold">5. HEALTH & BLOOM:</span>
                    <p className="text-slate-600 dark:text-retro-border mt-0.5">Keep HP high. Healthy plants sprout species-specific retro blooms as they grow!</p>
                  </div>
                </div>

                <button
                  onClick={() => setTutorialOpen(false)}
                  className="retro-btn w-full py-2.5 bg-emerald-500 dark:bg-retro-neonGreen text-black text-[8px] mt-4 font-bold"
                >
                  DISMISS
                </button>
              </div>
            </div>
          )}

          {/* ======================= MODAL: RENAME / NEW SLOT ======================= */}
          {nameModal.open && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel p-4">
                <h3 className="text-[10px] text-slate-900 dark:text-white mb-2">
                  {nameModal.isNew ? ('NEW FILE (SLOT ' + (nameModal.slotIndex + 1) + ')') : 'RENAME FILE'}
                </h3>
                <p className="text-[8px] text-slate-600 dark:text-retro-border mb-4 leading-relaxed">
                  ENTER DESIGNATION CODE:
                </p>
                <form onSubmit={(e) => { e.preventDefault(); handleSaveName(e.target.elements.slotInput.value); }}>
                  <input
                    name="slotInput"
                    defaultValue={nameModal.currentName}
                    autoFocus
                    maxLength={12}
                    className="w-full px-2 py-2 text-[10px] bg-slate-100 dark:bg-black border-2 border-slate-600 dark:border-retro-border text-emerald-700 dark:text-retro-neonGreen focus:outline-none focus:border-black dark:focus:border-white mb-4 uppercase font-bold"
                  />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false })} className="retro-btn flex-1 py-2 text-[8px] bg-slate-200 dark:bg-black text-black dark:text-white">
                      CANCEL
                    </button>
                    <button type="submit" className="retro-btn flex-1 py-2 text-[8px] bg-emerald-500 dark:bg-retro-neonGreen text-black font-bold">
                      ACCEPT
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ======================= MODAL: SPECIES DISCOVERY ======================= */}
          {revealModal.open && revealModal.plantType && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel border-emerald-500 dark:border-retro-neonGreen p-5 text-center">
                
                <div className="mb-4 animate-pulse">
                  <span className="text-[10px] text-black bg-emerald-400 dark:bg-retro-neonGreen px-2 py-1 font-bold">SPECIES IDENTIFIED!</span>
                </div>

                <h2 className="text-sm text-slate-900 dark:text-white mb-2">
                  {getArch(revealModal.plantType).name}
                </h2>

                <p className="text-[8px] text-slate-600 dark:text-retro-border mb-4 leading-loose">
                  {getArch(revealModal.plantType).tagline}
                </p>

                <div className="bg-slate-100 dark:bg-black border-2 border-slate-600 dark:border-retro-border p-3 text-left text-[8px] space-y-2 mb-6">
                  <div className="flex justify-between">
                    <span className="text-slate-600 dark:text-retro-border">IDEAL H2O:</span>
                    <span className="text-blue-600 dark:text-retro-blue font-bold">{getArch(revealModal.plantType).moisture[0]}-{getArch(revealModal.plantType).moisture[1]}%</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600 dark:text-retro-border">IDEAL SUN:</span>
                    <span className="text-amber-600 dark:text-retro-yellow font-bold">{getArch(revealModal.plantType).sunlight[0]}-{getArch(revealModal.plantType).sunlight[1]}%</span>
                  </div>
                </div>

                <button onClick={() => setRevealModal({ open: false, plantType: null })} className="retro-btn w-full py-3 bg-emerald-500 dark:bg-retro-neonGreen text-black text-[8px] font-bold">
                  CONTINUE
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
