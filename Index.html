<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tiny Plant Sim v1.2</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Press Start 2P"', 'monospace'] },
          colors: {
            retro: {
              bg: '#111827', panel: '#1f2937', green: '#39ff14', red: '#ff003c', yellow: '#ffea00', blue: '#00f0ff', border: '#94a3b8'
            }
          },
          keyframes: {
            bop: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(2px)' } }
          },
          animation: {
            'retro-bop': 'bop 0.8s steps(2, end) infinite'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { height: 100%; height: 100dvh; overflow: hidden; touch-action: manipulation; background-color: #000; }
    body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .crt-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 3px 100%; z-index: 100; pointer-events: none;
    }
    .retro-panel { background-color: #1f2937; border: 3px solid #94a3b8; box-shadow: 4px 4px 0px 0px #000; }
    .retro-btn { border: 2px solid #fff; box-shadow: 3px 3px 0px 0px #000; transition: all 0.05s ease; }
    .retro-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0px 0px 0px 0px #000; }
    .retro-btn:disabled { opacity: 0.5; box-shadow: 1px 1px 0px 0px #000; transform: translate(2px, 2px); }
    svg.pixelated { shape-rendering: crispEdges; }
    
    .greenhouse-grid {
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.1) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 2px, transparent 2px);
      background-size: 50% 33.33%;
    }
  </style>
</head>
<body class="text-white">
  <div class="crt-overlay"></div>
  <div id="root" class="h-full relative z-10 bg-retro-bg"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PLANT_ARCHETYPES = {
      cactus: { name: 'DESERT CACTUS', tagline: 'INTENSE SUN, LITTLE WATER.', moisture: [10, 35], sunlight: [65, 95], temp: [72, 95], soil: [25, 65], color: '#22c55e', leafColor: '#16a34a' },
      succulent: { name: 'FLESHY SUCC', tagline: 'WARMTH & DRY SOIL.', moisture: [20, 45], sunlight: [55, 85], temp: [65, 88], soil: [40, 75], color: '#14b8a6', leafColor: '#0d9488' },
      fern: { name: 'CANOPY FERN', tagline: 'MOISTURE & GENTLE SHADE.', moisture: [60, 90], sunlight: [25, 55], temp: [60, 76], soil: [60, 95], color: '#4ade80', leafColor: '#22c55e' },
      leafy: { name: 'BROAD AROID', tagline: 'BALANCED LIGHT & WARMTH.', moisture: [45, 75], sunlight: [40, 75], temp: [65, 82], soil: [50, 90], color: '#86efac', leafColor: '#4ade80' },
      flytrap: { name: 'SNAP TRAP', tagline: 'WET, WARM, AND HUNGRY.', moisture: [70, 95], sunlight: [50, 80], temp: [70, 90], soil: [30, 60], color: '#ef4444', leafColor: '#22c55e' },
      bonsai: { name: 'PINE BONSAI', tagline: 'NEEDS PERFECT BALANCE.', moisture: [40, 60], sunlight: [40, 60], temp: [60, 80], soil: [60, 90], color: '#78350f', leafColor: '#065f46' },
      orchid: { name: 'MOTH ORCHID', tagline: 'DELICATE AND HUMID.', moisture: [50, 80], sunlight: [30, 60], temp: [68, 82], soil: [40, 70], color: '#d946ef', leafColor: '#84cc16' },
      snake: { name: 'VIPER BLADE', tagline: 'THRIVES ON NEGLECT.', moisture: [5, 30], sunlight: [10, 80], temp: [55, 95], soil: [20, 90], color: '#fef08a', leafColor: '#15803d' },
      spider: { name: 'CREEP VINE', tagline: 'GROWS FAST, EASY CARE.', moisture: [40, 70], sunlight: [30, 70], temp: [60, 80], soil: [40, 80], color: '#a3e635', leafColor: '#4d7c0f' },
      money: { name: 'COIN TREE', tagline: 'BRINGS GOOD LUCK.', moisture: [30, 60], sunlight: [40, 70], temp: [65, 85], soil: [50, 80], color: '#92400e', leafColor: '#10b981' }
    };

    // Safe lookup helper to prevent crashes from old/corrupt saves
    const getArch = (type) => PLANT_ARCHETYPES[type] || PLANT_ARCHETYPES['leafy'];

    const safeParse = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        console.warn(`Data format error for ${key}, falling back to defaults.`);
        return fallback;
      }
    };

    function generateNewPlant(slotNum, customName) {
      const types = Object.keys(PLANT_ARCHETYPES);
      const chosenType = types[Math.floor(Math.random() * types.length)];
      const archetype = PLANT_ARCHETYPES[chosenType];
      const randomReveal = Math.floor(Math.random() * (10 - 5 + 1)) + 5;

      return {
        id: Date.now(),
        slotName: customName || `SLOT ${slotNum + 1}`,
        type: chosenType,
        revealed: false,
        revealAge: randomReveal,
        age: 1.0,
        health: 100,
        isDead: false,
        potColor: ['#ea580c', '#0ea5e9', '#059669', '#8b5cf6'][slotNum % 4],
        conditions: { moisture: 50, sunlight: 50, temperature: 72, soilHealth: 85, infestation: 0 },
        ideals: { moisture: [...archetype.moisture], sunlight: [...archetype.sunlight], temp: [...archetype.temp], soil: [...archetype.soil] }
      };
    }

    // Icons
    const DropletIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L12 2 L16 10 L18 14 L18 18 L16 22 L8 22 L6 18 L6 14 L8 10 Z"/></svg>;
    const SunIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8"/><rect x="11" y="2" width="2" height="4"/><rect x="11" y="18" width="2" height="4"/><rect x="2" y="11" width="4" height="2"/><rect x="18" y="11" width="4" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="18" y="18" width="2" height="2"/><rect x="4" y="18" width="2" height="2"/><rect x="18" y="4" width="2" height="2"/></svg>;
    const ThermometerIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="10" y="2" width="4" height="14"/><rect x="8" y="14" width="8" height="8"/></svg>;
    const BugIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="6" width="8" height="12"/><rect x="4" y="8" width="4" height="2"/><rect x="16" y="8" width="4" height="2"/><rect x="4" y="14" width="4" height="2"/><rect x="16" y="14" width="4" height="2"/><rect x="10" y="2" width="1" height="4"/><rect x="13" y="2" width="1" height="4"/></svg>;
    const ShovelIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="14,2 22,2 22,10 12,20 4,20 4,12"/><rect x="4" y="14" width="6" height="6" fill="#111827"/></svg>;
    const SprayIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="14"/><rect x="10" y="4" width="4" height="4"/><rect x="4" y="4" width="6" height="2"/><rect x="2" y="4" width="2" height="6"/></svg>;
    const ScissorsIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><polygon points="10,10 20,2 20,6 12,12"/><polygon points="10,14 20,22 20,18 12,12"/><rect x="6" y="6" width="2" height="2" fill="#111827"/><rect x="6" y="16" width="2" height="2" fill="#111827"/></svg>;
    const PencilIcon = () => <svg className="w-3 h-3 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="16,2 22,8 8,22 2,22 2,16"/></svg>;
    const ArrowLeftIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><polygon points="10,4 2,12 10,20 10,14 22,14 22,10 10,10"/></svg>;
    const TrashIcon = () => <svg className="w-4 h-4 pixelated" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="16"/><rect x="4" y="4" width="16" height="2"/><rect x="10" y="2" width="4" height="2"/></svg>;

    const PlantVisual = ({ plant, isBlooming, soilBaseY = 168, scale = 1 }) => {
      const arch = getArch(plant.type);
      const conds = plant.conditions || {};
      const ideals = plant.ideals || { moisture: [0, 100] };
      const moisture = conds.moisture || 50;
      const mMin = ideals.moisture?.[0] || 0;
      const mMax = ideals.moisture?.[1] || 100;
      
      const body = plant.isDead ? '#555' : plant.health < 35 && moisture < mMin ? '#d97706' : plant.health < 35 && moisture > mMax ? '#064e3b' : arch.color;
      const leaf = plant.isDead ? '#444' : plant.health < 35 && moisture < mMin ? '#f59e0b' : plant.health < 35 && moisture > mMax ? '#047857' : arch.leafColor;
      
      const growthProgress = Math.min((plant.age || 1) / 18, 1);
      const plantHeight = 24 + growthProgress * 70;
      const stemTopY = soilBaseY - plantHeight;
      const strokeW = 4;

      return (
        <svg viewBox="0 0 200 215" className="w-full h-full max-h-full overflow-visible pixelated" preserveAspectRatio="xMidYMid meet">
          <g transform={`scale(${scale}) translate(${100 * (1 - scale)}, ${215 * (1 - scale)})`}>
            {conds.infestation > 10 && (
              <g fill="#ff003c" className="animate-retro-bop">
                <rect x="85" y={soilBaseY - 30} width="4" height="4" /><rect x="115" y={soilBaseY - 45} width="4" height="4" />
                <rect x="102" y={soilBaseY - 60} width="4" height="4" /><rect x="75" y={soilBaseY - 15} width="4" height="4" />
              </g>
            )}

            <g className={plant.isDead ? "" : "animate-retro-bop origin-bottom"}>
              {plant.isDead ? (
                <g stroke="#555" strokeWidth="6" fill="none">
                  <polyline points="100,170 102,140 120,135 135,132 135,155" />
                  <polyline points="112,140 125,150 120,162" />
                </g>
              ) : !plant.revealed ? (
                <g strokeWidth={strokeW}>
                  <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={body} />
                  <polyline points={`100,${stemTopY} 85,${stemTopY-5} 78,${stemTopY}`} stroke={leaf} fill="none"/>
                  <polyline points={`100,${stemTopY} 115,${stemTopY-5} 122,${stemTopY}`} stroke={leaf} fill="none"/>
                </g>
              ) : plant.type === 'cactus' ? (
                <g>
                  <rect x="88" y={stemTopY} width="24" height={plantHeight} fill={body} stroke="#000" strokeWidth="4" />
                  <line x1="84" y1={stemTopY + 20} x2="116" y2={stemTopY + 20} stroke="#ffea00" strokeWidth="2" />
                  <line x1="84" y1={stemTopY + 45} x2="116" y2={stemTopY + 45} stroke="#ffea00" strokeWidth="2" />
                  {plant.age >= 10 && <polyline points={`88,${stemTopY+35} 75,${stemTopY+35} 75,${stemTopY+15} 82,${stemTopY+15}`} stroke={body} strokeWidth="8" fill="none" />}
                  {plant.age >= 13 && <polyline points={`112,${stemTopY+48} 125,${stemTopY+48} 125,${stemTopY+28} 118,${stemTopY+28}`} stroke={body} strokeWidth="8" fill="none" />}
                  {isBlooming && <rect x="94" y={stemTopY - 12} width="12" height="12" fill="#ff003c" />}
                </g>
              ) : plant.type === 'succulent' ? (
                <g fill={leaf} stroke="#000" strokeWidth="2">
                  <rect x="66" y={soilBaseY - 20} width="68" height="20" />
                  <rect x="76" y={soilBaseY - 30} width="48" height="18" />
                  <rect x="86" y={soilBaseY - 40} width="28" height="16" fill={body} />
                  {isBlooming && (
                    <g><polyline points={`100,${soilBaseY-30} 118,${soilBaseY-60} 122,${soilBaseY-80}`} stroke="#39ff14" strokeWidth="4" fill="none" /><rect x="118" y={soilBaseY - 84} width="8" height="8" fill="#ffea00" /></g>
                  )}
                </g>
              ) : plant.type === 'fern' ? (
                <g stroke={body} fill="none" strokeWidth={strokeW}>
                  <line x1="100" y1={soilBaseY} x2="98" y2={stemTopY} />
                  {[0.25, 0.5, 0.75, 1.0].map((frac, idx) => {
                    const yPos = soilBaseY - plantHeight * frac; const spread = 20 + frac * 16;
                    return (
                      <g key={idx}>
                        <polyline points={`100,${yPos} ${100-spread},${yPos-10} ${100-spread-4},${yPos+4}`} stroke={leaf} />
                        <polyline points={`100,${yPos} ${100+spread},${yPos-10} ${100+spread+4},${yPos+4}`} stroke={leaf} />
                      </g>
                    );
                  })}
                </g>
              ) : plant.type === 'flytrap' ? (
                <g>
                  <polyline points={`100,${soilBaseY} 80,${stemTopY+20} 60,${stemTopY}`} stroke={leaf} strokeWidth="4" fill="none"/>
                  <polyline points={`100,${soilBaseY} 120,${stemTopY+20} 140,${stemTopY}`} stroke={leaf} strokeWidth="4" fill="none"/>
                  <polygon points={`50,${stemTopY} 70,${stemTopY} 60,${stemTopY+15}`} fill={body} />
                  <polygon points={`130,${stemTopY} 150,${stemTopY} 140,${stemTopY+15}`} fill={body} />
                  <polyline points={`50,${stemTopY} 55,${stemTopY-10} 60,${stemTopY} 65,${stemTopY-10} 70,${stemTopY}`} stroke="#fff" fill="none" />
                  <polyline points={`130,${stemTopY} 135,${stemTopY-10} 140,${stemTopY} 145,${stemTopY-10} 150,${stemTopY}`} stroke="#fff" fill="none" />
                </g>
              ) : plant.type === 'bonsai' ? (
                <g>
                  <polyline points={`100,${soilBaseY} 95,${soilBaseY-20} 115,${soilBaseY-40} 100,${stemTopY}`} stroke={body} strokeWidth="12" fill="none"/>
                  <rect x="70" y={stemTopY-10} width="60" height="20" fill={leaf} />
                  <rect x="110" y={soilBaseY-45} width="30" height="15" fill={leaf} />
                </g>
              ) : plant.type === 'orchid' ? (
                <g>
                  <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={leaf} strokeWidth="4" />
                  <polyline points={`100,${soilBaseY-10} 120,${soilBaseY-5}`} stroke={leaf} strokeWidth="6" fill="none"/>
                  <polyline points={`100,${soilBaseY-15} 80,${soilBaseY-10}`} stroke={leaf} strokeWidth="6" fill="none"/>
                  <rect x="90" y={stemTopY} width="20" height="20" fill={body} />
                  <rect x="95" y={stemTopY+5} width="10" height="10" fill="#fff" />
                  {isBlooming && <rect x="90" y={stemTopY+30} width="20" height="20" fill={body} />}
                </g>
              ) : plant.type === 'snake' ? (
                <g fill={leaf} stroke={body} strokeWidth="2">
                  <polygon points={`100,${soilBaseY} 90,${stemTopY} 100,${stemTopY-20} 110,${stemTopY}`} />
                  <polygon points={`90,${soilBaseY} 75,${stemTopY+20} 85,${stemTopY} 95,${stemTopY+20}`} />
                  <polygon points={`110,${soilBaseY} 105,${stemTopY+30} 115,${stemTopY+10} 125,${stemTopY+30}`} />
                </g>
              ) : plant.type === 'spider' ? (
                <g stroke={leaf} strokeWidth="4" fill="none">
                  <line x1="100" y1={soilBaseY} x2="100" y2={soilBaseY-15} />
                  {[0, 1, 2, 3].map(i => (
                    <g key={i}>
                      <polyline points={`100,${soilBaseY-15} ${60 - i*10},${stemTopY + i*20} ${50 - i*5},${soilBaseY-10}`} />
                      <polyline points={`100,${soilBaseY-15} ${140 + i*10},${stemTopY + i*20} ${150 + i*5},${soilBaseY-10}`} />
                    </g>
                  ))}
                </g>
              ) : plant.type === 'money' ? (
                <g>
                  <polyline points={`96,${soilBaseY} 104,${stemTopY+20}`} stroke={body} strokeWidth="6" fill="none"/>
                  <polyline points={`104,${soilBaseY} 96,${stemTopY+20}`} stroke={body} strokeWidth="6" fill="none"/>
                  <rect x="85" y={stemTopY} width="10" height="10" fill={leaf} />
                  <rect x="105" y={stemTopY} width="10" height="10" fill={leaf} />
                  <rect x="95" y={stemTopY-10} width="10" height="10" fill={leaf} />
                </g>
              ) : (
                <g>
                  <g fill={leaf} stroke="#000" strokeWidth="2">
                    <line x1="100" y1={soilBaseY} x2="100" y2={stemTopY} stroke={body} strokeWidth="4" />
                    <polygon points={`100,${soilBaseY - plantHeight*0.4} 70,${soilBaseY - plantHeight*0.5} 62,${soilBaseY - plantHeight*0.35} 80,${soilBaseY - plantHeight*0.28}`} />
                    <polygon points={`100,${soilBaseY - plantHeight*0.65} 130,${soilBaseY - plantHeight*0.75} 138,${soilBaseY - plantHeight*0.6} 120,${soilBaseY - plantHeight*0.52}`} />
                    <polygon points={`100,${stemTopY} 85,${stemTopY-20} 100,${stemTopY-25} 115,${stemTopY-20}`} />
                  </g>
                  {isBlooming && (
                    <g>
                      <polyline points={`98,${soilBaseY-15} 84,${soilBaseY-50} 80,${soilBaseY-75}`} stroke="#39ff14" strokeWidth="4" fill="none" />
                      <rect x="72" y={soilBaseY - 86} width="16" height="20" fill="#fff" stroke="#000" strokeWidth="2" />
                      <rect x="78" y={soilBaseY - 82} width="4" height="12" fill="#ffea00" />
                    </g>
                  )}
                </g>
              )}
            </g>
            <rect x="58" y="163" width="84" height="14" fill="#3e2723" stroke="#000" strokeWidth="2" />
            <polygon points="60,170 70,214 130,214 140,170" fill={plant.potColor || '#ea580c'} stroke="#000" strokeWidth="2" />
          </g>
        </svg>
      );
    }

    function App() {
      const [screen, setScreen] = useState('home');
      const [activeSlot, setActiveSlot] = useState(0);
      
      const [slotsData, setSlotsData] = useState(() => {
        return [0, 1, 2].map(idx => safeParse(`plant_slot_${idx}`, null));
      });
      
      const [sunroomData, setSunroomData] = useState(() => {
        const data = safeParse('plant_sunroom', []);
        return Array.isArray(data) ? data : [];
      });
      
      const [plant, setPlant] = useState(null);
      const [toast, setToast] = useState('');
      
      const [nameModal, setNameModal] = useState({ open: false, slotIndex: 0, currentName: '', isNew: false });
      const [revealModal, setRevealModal] = useState({ open: false, plantType: null });
      const [tutorialOpen, setTutorialOpen] = useState(false);

      useEffect(() => {
        if (!plant) return;
        localStorage.setItem(`plant_slot_${activeSlot}`, JSON.stringify(plant));
        setSlotsData(prev => { const next = [...prev]; next[activeSlot] = plant; return next; });
      }, [plant, activeSlot]);

      useEffect(() => {
        localStorage.setItem('plant_sunroom', JSON.stringify(sunroomData));
      }, [sunroomData]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };

      useEffect(() => {
        const isDead = plant ? plant.isDead : false;
        if (screen !== 'game' || !plant || isDead || revealModal.open || tutorialOpen) return;

        const interval = setInterval(() => {
          setPlant(prev => {
            if (!prev || prev.isDead) return prev;
            
            const c = prev.conditions || {};
            let moisture = c.moisture ?? 50;
            let sunlight = c.sunlight ?? 50;
            let temperature = c.temperature ?? 72;
            let soilHealth = c.soilHealth ?? 85;
            let infestation = c.infestation ?? 0;
            
            let healthDelta = 0;

            const moistureDrain = 1.0 + (temperature > 80 ? 0.8 : 0) + (sunlight > 75 ? 0.6 : 0);
            moisture = Math.max(0, Math.min(100, moisture - moistureDrain));
            soilHealth = Math.max(0, Math.min(100, soilHealth - 0.25));

            if (soilHealth < 40 || moisture > 85) {
              if (Math.random() < 0.35) infestation = Math.min(100, infestation + 4);
            }

            const idls = prev.ideals || {};
            const [mMin = 0, mMax = 100] = idls.moisture || [0, 100];
            const [sMin = 0, sMax = 100] = idls.sunlight || [0, 100];
            const [tMin = 0, tMax = 100] = idls.temp || [0, 100];
            const [soilMin = 0] = idls.soil || [0];

            if (moisture < mMin) healthDelta -= (mMin - moisture) * 0.15; else if (moisture > mMax) healthDelta -= (moisture - mMax) * 0.15; else healthDelta += 0.5;
            if (sunlight < sMin) healthDelta -= (sMin - sunlight) * 0.12; else if (sunlight > sMax) healthDelta -= (sunlight - sMax) * 0.12; else healthDelta += 0.4;
            if (temperature < tMin) healthDelta -= (tMin - temperature) * 0.18; else if (temperature > tMax) healthDelta -= (temperature - tMax) * 0.18;
            if (soilHealth < soilMin) healthDelta -= 1.2;
            if (infestation > 15) healthDelta -= (infestation - 15) * 0.22;

            const newHealth = Math.max(0, Math.min(100, (prev.health ?? 100) + healthDelta));
            const nowDead = newHealth <= 0;

            let newAge = prev.age ?? 1; 
            let newlyRevealed = false; 
            let newRevealedState = prev.revealed ?? false;

            if (!nowDead && newHealth > 40) {
              newAge = +(newAge + 0.15).toFixed(2);
              if (!newRevealedState && newAge >= (prev.revealAge ?? 5)) { 
                newRevealedState = true; newlyRevealed = true; 
              }
            }
            
            if (newlyRevealed) setRevealModal({ open: true, plantType: prev.type });

            return { 
              ...prev, 
              age: newAge, 
              health: Math.round(newHealth), 
              revealed: newRevealedState, 
              isDead: nowDead, 
              conditions: { 
                moisture: Math.round(moisture), 
                sunlight, 
                temperature, 
                soilHealth: Math.round(soilHealth), 
                infestation: Math.round(infestation) 
              } 
            };
          });
        }, 3000);

        return () => clearInterval(interval);
      }, [screen, plant ? plant.isDead : false, revealModal.open, tutorialOpen]);

      const applyCare = (action) => {
        if (!plant || plant.isDead) return;
        setPlant(prev => {
          let c = { ...(prev.conditions || {}) }; 
          let h = prev.health ?? 100;
          c.moisture = c.moisture ?? 50;
          c.soilHealth = c.soilHealth ?? 85;
          c.sunlight = c.sunlight ?? 50;
          c.temperature = c.temperature ?? 72;
          c.infestation = c.infestation ?? 0;

          switch (action) {
            case 'water': c.moisture = Math.min(100, c.moisture + 22); if (c.infestation > 0) c.infestation = Math.max(0, c.infestation - 4); showToast('+H2O'); break;
            case 'fertilize': c.soilHealth = Math.min(100, c.soilHealth + 26); showToast('+SOIL'); break;
            case 'sun_up': c.sunlight = Math.min(100, c.sunlight + 15); showToast('+SUN'); break;
            case 'sun_down': c.sunlight = Math.max(0, c.sunlight - 15); showToast('-SUN'); break;
            case 'temp_up': c.temperature = Math.min(105, c.temperature + 4); showToast('+HEAT'); break;
            case 'temp_down': c.temperature = Math.max(40, c.temperature - 4); showToast('-HEAT'); break;
            case 'spray': c.infestation = Math.max(0, c.infestation - 45); c.soilHealth = Math.max(0, c.soilHealth - 6); showToast('PESTS CLR'); break;
            case 'prune': h = Math.min(100, h + 8); showToast('+HP'); break;
          }
          return { ...prev, health: h, conditions: c };
        });
      };

      const handleSaveName = (enteredName) => {
        const finalName = enteredName.trim().toUpperCase() || `SLOT ${nameModal.slotIndex + 1}`;
        if (nameModal.isNew) {
          const fresh = generateNewPlant(nameModal.slotIndex, finalName);
          setPlant(fresh); setActiveSlot(nameModal.slotIndex);
          localStorage.setItem(`plant_slot_${nameModal.slotIndex}`, JSON.stringify(fresh));
          setSlotsData(prev => { const next = [...prev]; next[nameModal.slotIndex] = fresh; return next; });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false }); setScreen('game');
        } else {
          if (plant && activeSlot === nameModal.slotIndex) setPlant(prev => ({ ...prev, slotName: finalName }));
          setSlotsData(prev => {
            const next = [...prev];
            if (next[nameModal.slotIndex]) { 
              next[nameModal.slotIndex] = { ...next[nameModal.slotIndex], slotName: finalName }; 
              localStorage.setItem(`plant_slot_${nameModal.slotIndex}`, JSON.stringify(next[nameModal.slotIndex])); 
            }
            return next;
          });
          setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false });
        }
      };

      const retirePlant = () => {
        if (sunroomData.length >= 9) { showToast("SUNROOM FULL!"); return; }
        if (confirm(`RETIRE ${plant.slotName} TO SUNROOM?`)) {
          setSunroomData(prev => [...prev, plant]);
          localStorage.removeItem(`plant_slot_${activeSlot}`);
          setSlotsData(prev => { const next = [...prev]; next[activeSlot] = null; return next; });
          setPlant(null);
          setScreen('home');
        }
      };

      const getBarColor = (val, [min, max], isPest = false) => {
        if (isPest) return val <= 15 ? 'bg-retro-green' : val <= 40 ? 'bg-retro-yellow' : 'bg-retro-red';
        if (val >= min && val <= max) return 'bg-retro-green';
        return Math.min(Math.abs(val - min), Math.abs(val - max)) <= 12 ? 'bg-retro-yellow' : 'bg-retro-red';
      };

      const isBlooming = plant && !plant.isDead && plant.age >= 8 && plant.health >= 60;
      const canRetire = plant && !plant.isDead && plant.age >= 20 && plant.revealed;

      return (
        <div className="h-full w-full max-w-md mx-auto flex flex-col justify-between overflow-hidden p-3 box-border">
          
          {/* ======================= SCREEN 1: HOME ======================= */}
          {screen === 'home' && (
            <div className="h-full flex flex-col justify-between py-2">
              <div className="flex justify-end px-1 py-2">
                <button onClick={() => setTutorialOpen(true)} className="text-[8px] text-retro-yellow hover:text-white retro-btn px-2 py-1 bg-black">? HOW TO PLAY</button>
              </div>

              <div className="flex flex-col items-center text-center px-4 mb-2">
                <div className="w-12 h-12 mb-3 bg-black flex items-center justify-center border-4 border-retro-green shadow-[4px_4px_0px_0px_#39ff14]">
                  <DropletIcon />
                </div>
                <h1 className="text-xl leading-relaxed text-retro-green shadow-black drop-shadow-md">TINY PLANT<br/>SIM v1.2</h1>
              </div>

              <div className="space-y-3 mb-4">
                {[0, 1, 2].map((idx) => {
                  const data = slotsData[idx];
                  return (
                    <div key={idx} className="retro-panel flex items-center justify-between p-3">
                      {data ? (
                        <div className="flex-1 min-w-0 pr-2">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] text-retro-blue truncate">{data.slotName || `SLOT ${idx + 1}`}</span>
                            <button onClick={() => setNameModal({ open: true, slotIndex: idx, currentName: data.slotName, isNew: false })} className="text-retro-border hover:text-white"><PencilIcon /></button>
                          </div>
                          <div className="flex flex-col gap-1 mt-2 text-[8px] text-retro-border">
                            <span>{data.isDead ? 'WITHERED' : data.revealed ? getArch(data.type).name : 'MYSTERY SEED'}</span>
                            <span>DAY {Math.floor(data.age || 1)} • <span className={data.isDead ? 'text-retro-red' : 'text-retro-green'}>{data.isDead ? 'DEAD' : `${data.health || 0}% HP`}</span></span>
                          </div>
                        </div>
                      ) : (
                        <div className="flex-1 min-w-0"><span className="text-[10px] text-retro-border">FILE {idx + 1} : EMPTY</span></div>
                      )}
                      <div className="flex items-center gap-2 shrink-0">
                        {data ? (
                          <>
                            <button onClick={() => { setActiveSlot(idx); setPlant(data); setScreen('game'); }} className="retro-btn bg-retro-green text-black px-2 py-2 text-[8px]">PLAY</button>
                            <button onClick={(e) => { if(confirm("ERASE SLOT?")) { localStorage.removeItem(`plant_slot_${idx}`); setSlotsData(p => {const n=[...p];n[idx]=null;return n;}) } }} className="retro-btn bg-retro-red text-white p-2"><TrashIcon /></button>
                          </>
                        ) : (
                          <button onClick={() => setNameModal({ open: true, slotIndex: idx, currentName: `SLOT ${idx + 1}`, isNew: true })} className="retro-btn bg-retro-panel border-retro-border text-white px-2 py-2 text-[8px]">NEW</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={() => setScreen('sunroom')} className="retro-btn w-full bg-[#8b5cf6] text-white py-3 text-[10px] mb-2 flex items-center justify-center gap-2">
                <SunIcon /> VISIT SUNROOM ({sunroomData.length}/9)
              </button>

              <footer className="text-center text-[8px] text-retro-border">© 2026 RETRO STUDIOS</footer>
            </div>
          )}

          {/* ======================= SCREEN 2: GAMEPLAY ======================= */}
          {screen === 'game' && plant && (
            <div className="h-full flex flex-col justify-between overflow-hidden">
              <div className="shrink-0 space-y-2 pb-1">
                <div className="flex items-center justify-between py-1 border-b-4 border-retro-panel">
                  <button onClick={() => setScreen('home')} className="retro-btn bg-retro-panel text-white px-2 py-1.5 text-[8px] flex items-center gap-1"><ArrowLeftIcon /> BACK</button>
                  <div className="flex items-center gap-2 max-w-[120px] truncate">
                    <span className="text-[10px] text-retro-blue truncate">{plant.slotName || 'PLANT'}</span>
                  </div>
                  <div className="flex items-center gap-1">
                    {canRetire && <button onClick={retirePlant} className="retro-btn bg-retro-yellow text-black px-1.5 py-1 text-[8px] animate-pulse">RETIRE</button>}
                    <span className={`text-[10px] px-2 py-1 border-2 border-current bg-black ${plant.isDead ? 'text-retro-red' : (plant.health || 0) > 70 ? 'text-retro-green' : 'text-retro-yellow'}`}>{plant.isDead ? 'DEAD' : `HP:${plant.health || 0}`}</span>
                  </div>
                </div>
                <div className="flex justify-between items-center px-1 pt-1">
                  <span className="text-[10px] text-white">{plant.isDead ? 'WITHERED' : plant.revealed ? getArch(plant.type).name : 'MYSTERY SEED'}</span>
                  <span className="text-[10px] text-retro-border">DAY {Math.floor(plant.age || 1)}</span>
                </div>
              </div>

              <div className="flex-1 min-h-0 grid grid-cols-12 gap-3 my-2 items-stretch retro-panel p-2">
                <div className="col-span-7 h-full flex flex-col items-center justify-center relative bg-black border-4 border-retro-border overflow-hidden">
                  <PlantVisual plant={plant} isBlooming={isBlooming} />
                </div>

                <div className="col-span-5 flex flex-col justify-between py-1 px-1">
                  {['moisture', 'sunlight', 'temperature', 'soilHealth', 'infestation'].map((cond, i) => {
                    const labels = ['H2O', 'SUN', 'TMP', 'DIRT', 'BUG'];
                    const icons = [<DropletIcon key="d"/>, <SunIcon key="s"/>, <ThermometerIcon key="t"/>, <ShovelIcon key="sh"/>, <BugIcon key="b"/>];
                    
                    const c = plant.conditions || {};
                    const idls = plant.ideals || { moisture: [0, 100], sunlight: [0, 100], temp: [0, 100], soil: [0, 100] };
                    const val = c[cond] ?? (cond === 'infestation' ? 0 : 50);
                    
                    const lookup = cond === 'temperature' ? 'temp' : cond === 'soilHealth' ? 'soil' : cond;
                    const range = cond === 'infestation' ? [0, 15] : (idls[lookup] || [0, 100]);
                    const barW = cond === 'temperature' ? Math.min(100, Math.max(0, (val - 40) * 1.5)) : val;
                    
                    return (
                      <div key={cond}>
                        <div className="flex justify-between items-center text-[8px] mb-1">
                          <span className="flex items-center gap-1">{icons[i]} {labels[i]}</span>
                          <span>{val}{cond === 'temperature' ? '°' : '%'}</span>
                        </div>
                        <div className="w-full bg-black border-2 border-retro-border h-3">
                          <div className={`h-full ${getBarColor(val, range, cond === 'infestation')}`} style={{ width: `${barW}%` }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="shrink-0 space-y-2 pb-1">
                <div className="h-6 flex items-center justify-center">
                  {toast && <span className="text-[8px] text-black bg-retro-green px-2 py-1 border-2 border-white shadow-[2px_2px_0_0_#000]">{toast}</span>}
                </div>

                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => applyCare('water')} disabled={plant.isDead} className="retro-btn bg-[#1d4ed8] text-white py-2 flex flex-col items-center"><DropletIcon /><span className="text-[7px] mt-2">WATER</span></button>
                  <button onClick={() => applyCare('fertilize')} disabled={plant.isDead} className="retro-btn bg-[#b45309] text-white py-2 flex flex-col items-center"><ShovelIcon /><span className="text-[7px] mt-2">FEED</span></button>
                  <button onClick={() => applyCare('spray')} disabled={plant.isDead} className="retro-btn bg-[#be123c] text-white py-2 flex flex-col items-center"><SprayIcon /><span className="text-[7px] mt-2">SPRAY</span></button>
                  <button onClick={() => applyCare('prune')} disabled={plant.isDead} className="retro-btn bg-[#047857] text-white py-2 flex flex-col items-center"><ScissorsIcon /><span className="text-[7px] mt-2">PRUNE</span></button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1"><SunIcon /> SUN</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('sun_down')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">-</button>
                      <button onClick={() => applyCare('sun_up')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">+</button>
                    </div>
                  </div>
                  <div className="retro-panel p-2 flex items-center justify-between">
                    <span className="text-[8px] flex items-center gap-1"><ThermometerIcon /> TMP</span>
                    <div className="flex gap-2">
                      <button onClick={() => applyCare('temp_down')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">-</button>
                      <button onClick={() => applyCare('temp_up')} disabled={plant.isDead} className="retro-btn bg-black text-white w-6 h-6 flex items-center justify-center text-[10px]">+</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ======================= SCREEN 3: SUNROOM ======================= */}
          {screen === 'sunroom' && (
            <div className="h-full flex flex-col justify-between py-2 greenhouse-grid relative">
              <div className="flex items-center justify-between py-1 px-2 border-b-4 border-retro-panel bg-black/80">
                <button onClick={() => setScreen('home')} className="retro-btn bg-retro-panel text-white px-2 py-1.5 text-[8px] flex items-center gap-1"><ArrowLeftIcon /> BACK</button>
                <span className="text-[10px] text-retro-yellow">THE SUNROOM</span>
              </div>
              
              <div className="flex-1 overflow-y-auto p-2">
                <div className="grid grid-cols-3 gap-2">
                  {sunroomData.map((sp, i) => (
                    <div key={i} className="retro-panel bg-black flex flex-col items-center justify-between p-1 h-32 border-2 border-[#8b5cf6]">
                      <div className="w-full h-16 flex items-center justify-center relative overflow-hidden">
                        <PlantVisual plant={sp} isBlooming={true} scale={0.45} soilBaseY={200} />
                      </div>
                      <div className="text-center w-full bg-[#1f2937] p-1 border-t-2 border-[#8b5cf6]">
                        <div className="text-[6px] text-retro-blue truncate mb-1">{sp.slotName || 'PLANT'}</div>
                        <div className="text-[6px] text-retro-border truncate">{getArch(sp.type).name}</div>
                        <div className="text-[6px] text-retro-green mt-1">DAY {Math.floor(sp.age || 1)}</div>
                      </div>
                    </div>
                  ))}
                  {Array.from({ length: Math.max(0, 9 - sunroomData.length) }).map((_, i) => (
                    <div key={`empty-${i}`} className="retro-panel bg-black/40 flex items-center justify-center h-32 border-2 border-retro-panel border-dashed">
                      <span className="text-[6px] text-retro-panel">EMPTY</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ======================= MODALS ======================= */}
          {tutorialOpen && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel p-4">
                <h3 className="text-xs text-retro-yellow mb-4 text-center">HOW TO PLAY</h3>
                <ul className="text-[8px] text-white space-y-3 leading-loose mb-6">
                  <li><span className="text-retro-green">1.</span> MONITOR YOUR SEEDLING'S STATS. KEEP METERS IN THE GREEN ZONE.</li>
                  <li><span className="text-retro-green">2.</span> METERS DEGRADE OVER TIME. USE BUTTONS TO WATER, FEED, PRUNE, AND CLEAR BUGS.</li>
                  <li><span className="text-retro-green">3.</span> ADJUST SUN AND HEAT TO MATCH THE PLANT'S IDEAL CLIMATE ONCE REVEALED.</li>
                  <li><span className="text-retro-green">4.</span> KEEP HP > 0. IF IT REACHES DAY 20 ALIVE, YOU CAN RETIRE IT TO THE SUNROOM!</li>
                </ul>
                <button onClick={() => setTutorialOpen(false)} className="retro-btn w-full py-3 bg-retro-green text-black text-[8px]">GOT IT</button>
              </div>
            </div>
          )}

          {nameModal.open && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel p-4">
                <h3 className="text-[10px] text-white mb-2">{nameModal.isNew ? `NEW FILE (SLOT ${nameModal.slotIndex + 1})` : 'RENAME FILE'}</h3>
                <p className="text-[8px] text-retro-border mb-4">ENTER DESIGNATION CODE:</p>
                <form onSubmit={(e) => { e.preventDefault(); handleSaveName(e.target.elements.slotInput.value); }}>
                  <input name="slotInput" defaultValue={nameModal.currentName} autoFocus maxLength={12} className="w-full px-2 py-2 text-[10px] bg-black border-2 border-retro-border text-retro-green focus:outline-none focus:border-white mb-4 uppercase" />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setNameModal({ open: false, slotIndex: 0, currentName: '', isNew: false })} className="retro-btn flex-1 py-2 text-[8px] bg-black text-white">CANCEL</button>
                    <button type="submit" className="retro-btn flex-1 py-2 text-[8px] bg-retro-green text-black">ACCEPT</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {revealModal.open && revealModal.plantType && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <div className="w-full max-w-xs retro-panel border-retro-green p-5 text-center">
                <div className="mb-4 animate-pulse"><span className="text-[10px] text-black bg-retro-green px-2 py-1">SPECIES IDENTIFIED!</span></div>
                <h2 className="text-sm text-white mb-2">{getArch(revealModal.plantType).name}</h2>
                <p className="text-[8px] text-retro-border mb-4 leading-loose">{getArch(revealModal.plantType).tagline}</p>
                <div className="bg-black border-2 border-retro-border p-3 text-left text-[8px] space-y-2 mb-6">
                  <div className="flex justify-between"><span className="text-retro-border">IDEAL H2O:</span><span className="text-retro-blue">{getArch(revealModal.plantType).moisture[0]}-{getArch(revealModal.plantType).moisture[1]}%</span></div>
                  <div className="flex justify-between"><span className="text-retro-border">IDEAL SUN:</span><span className="text-retro-yellow">{getArch(revealModal.plantType).sunlight[0]}-{getArch(revealModal.plantType).sunlight[1]}%</span></div>
                </div>
                <button onClick={() => setRevealModal({ open: false, plantType: null })} className="retro-btn w-full py-3 bg-retro-green text-black text-[8px]">CONTINUE</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
